name: Probe historical MagicOffice deployment assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-old-deploy-assets.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe immutable deployment assets
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request, urllib.error
          from pathlib import Path

          sites = {
            'v1.5.3': 'https://magicoffice-malbf0f28-magicoffice.vercel.app',
            'v1.5.4': 'https://magicoffice-gtruddab3-magicoffice.vercel.app',
            'v1.5.5': 'https://magicoffice-71pt19qae-magicoffice.vercel.app',
            'v1.5.6-pre-mibao': 'https://magicoffice-gkmmt98gj-magicoffice.vercel.app',
          }
          paths = [
            '/',
            '/assets/css/styles.v1.3.11.css',
            '/assets/js/app.v1.3.11.js',
            '/assets/js/schedule.v1.5.5.js',
            '/assets/images/brand/logo-header.png',
            '/assets/images/brand/logo-hero.png',
            '/assets/images/roster/cara.webp',
            '/assets/images/venue/sakura-throne.webp',
          ]

          def magic(b):
            x=b.lstrip().lower()
            if x.startswith((b'<!doctype html',b'<html')): return 'html'
            if b.startswith(b'\x89PNG\r\n\x1a\n'): return 'png'
            if b.startswith(b'RIFF') and b[8:12]==b'WEBP': return 'webp'
            if b.startswith(b'\xff\xd8\xff'): return 'jpeg'
            if x.startswith(b'/*') or b'{' in b[:256]: return 'text'
            return 'binary/text'

          results=[]
          for label,site in sites.items():
            for p in paths:
              url=site+p+('?' if '?' not in p else '&')+'probe=1'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Android Threads WebView','Cache-Control':'no-cache'})
              try:
                with urllib.request.urlopen(req,timeout=45) as r:
                  b=r.read(); status=r.status; ct=r.headers.get('content-type','').split(';')[0]; final=r.geturl(); err=''
              except Exception as e:
                b=b''; status=getattr(e,'code',0); ct=''; final=url; err=repr(e)
              row={'label':label,'site':site,'path':p,'status':status,'content_type':ct,'size':len(b),'sha256':hashlib.sha256(b).hexdigest(),'magic':magic(b),'final':final,'error':err}
              results.append(row)
              print(f"{label}\t{p}\tstatus={status}\ttype={ct}\tsize={len(b)}\tmagic={row['magic']}\tfinal={final}")
          Path('historical-assets.json').write_text(json.dumps(results,indent=2),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_historical_asset_probe
          path: historical-assets.json
          retention-days: 7
