name: Patch MagicOffice production v4 autoplay and poster layering

on:
  push:
    paths:
      - '.github/workflows/patch-production-v4-autoplay-layering.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep video playable under poster and record browser state on timeout
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          builder = Path('scripts/build_production_home_video_v4.mjs')
          s = builder.read_text()

          replacements = [
            (
              '<video class="home-hero-trial-video" muted loop playsinline webkit-playsinline preload="auto" aria-label="MagicOffice 試播影片" src="${videoUri}"></video>',
              '<video class="home-hero-trial-video" muted autoplay loop playsinline webkit-playsinline preload="auto" aria-label="MagicOffice 試播影片" src="${videoUri}"></video>'
            ),
            (
              '.homepage-cinema-stage [data-home-video-mount]{z-index:2!important;opacity:0!important;visibility:hidden!important;background:transparent!important;transition:opacity .32s ease,visibility .32s ease!important}',
              '.homepage-cinema-stage [data-home-video-mount]{z-index:0!important;opacity:1!important;visibility:visible!important;background:transparent!important;transition:opacity .32s ease,visibility .32s ease!important}'
            ),
            (
              '.homepage-cinema-stage[data-video-ready="true"] [data-home-video-mount]{opacity:1!important;visibility:visible!important}',
              '.homepage-cinema-stage[data-video-ready="true"] [data-home-video-mount]{z-index:2!important;opacity:1!important;visibility:visible!important}'
            ),
            (
              '.homepage-cinema-stage[data-video-ready="false"] [data-home-video-mount]{opacity:0!important;visibility:hidden!important}',
              '.homepage-cinema-stage[data-video-ready="false"] [data-home-video-mount]{z-index:0!important;opacity:1!important;visibility:visible!important}'
            ),
            (
              "video.muted=true;video.defaultMuted=true;video.loop=true;video.playsInline=true;video.setAttribute('muted','');video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');",
              "video.muted=true;video.defaultMuted=true;video.autoplay=true;video.loop=true;video.playsInline=true;video.setAttribute('muted','');video.setAttribute('autoplay','');video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');"
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit('Builder patch marker missing: ' + old[:90])
            s = s.replace(old, new, 1)
          builder.write_text(s)

          test = Path('scripts/test_production_home_video_v4.mjs')
          t = test.read_text()
          old_wait = """ if(fallback)await new Promise(r=>setTimeout(r,1600));
 else await page.waitForFunction(()=>{const s=document.querySelector('.homepage-cinema-stage'),v=s?.querySelector('.home-hero-trial-video');return s?.dataset.videoReady==='true'&&v&&!v.paused&&v.currentTime>.2},{timeout:30000});
"""
          new_wait = """ let playbackWaitError=null;
 if(fallback)await new Promise(r=>setTimeout(r,1600));
 else {
  try { await page.waitForFunction(()=>{const s=document.querySelector('.homepage-cinema-stage'),v=s?.querySelector('.home-hero-trial-video');return s?.dataset.videoReady==='true'&&v&&!v.paused&&v.currentTime>.2},{timeout:30000}); }
  catch(error){ playbackWaitError=String(error); }
 }
"""
          if old_wait not in t:
            raise SystemExit('Test wait patch marker missing')
          t = t.replace(old_wait, new_wait, 1)

          old_result = "results[name]={state,pageErrors,consoleErrors,failedRequests,forbiddenRequests};"
          new_result = "results[name]={state,pageErrors,consoleErrors,failedRequests,forbiddenRequests,playbackWaitError};"
          if old_result not in t:
            raise SystemExit('Test result patch marker missing')
          t = t.replace(old_result, new_result, 1)

          old_fallback = "  if(!(s.mountOpacity<.05)||s.mountVisibility!=='hidden')failures.push(`${name}: mount fallback`);"
          new_fallback = "  if(s.ready!=='false'||s.playable==='true')failures.push(`${name}: fallback video state ${s.ready}/${s.playable}`);"
          if old_fallback not in t:
            raise SystemExit('Fallback assertion patch marker missing')
          t = t.replace(old_fallback, new_fallback, 1)

          old_page_error = " if(r.pageErrors.length)failures.push(`${name}: page errors ${r.pageErrors.join('|')}`);"
          new_page_error = " if(r.pageErrors.length)failures.push(`${name}: page errors ${r.pageErrors.join('|')}`);\n if(r.playbackWaitError&&!name.startsWith('fallback'))failures.push(`${name}: playback wait ${r.playbackWaitError}`);"
          if old_page_error not in t:
            raise SystemExit('Playback wait reporting patch marker missing')
          t = t.replace(old_page_error, new_page_error, 1)
          test.write_text(t)
          PY

          node --check scripts/build_production_home_video_v4.mjs
          node --check scripts/test_production_home_video_v4.mjs

      - name: Commit autoplay and layering patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MagicOffice Production Build Bot'
          git config user.email 'sasta02001@gmail.com'
          git add scripts/build_production_home_video_v4.mjs scripts/test_production_home_video_v4.mjs
          git commit -m 'Keep homepage video playable beneath approved poster'
          git push origin HEAD:main
