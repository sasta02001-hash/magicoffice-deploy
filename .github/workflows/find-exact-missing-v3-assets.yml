name: Find exact missing v3 assets across Git history

on:
  push:
    paths:
      - '.github/workflows/find-exact-missing-v3-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Search every commit and tree for missing asset paths and hashes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --tags --prune
          python <<'PY'
          from pathlib import Path
          import subprocess,json,re
          targets=[
            'assets/media/44049d5f46ae6a12.webp',
            'assets/media/magicoffice-home-clean-scene-v5.webp',
            'assets/media/heartbeat-support-v7.png',
            'assets/css/magic-menu-cms-v1.0.4.css',
            'assets/media/homepage-cinema-frame-final-v2.webp',
            'assets/media/magicoffice-home-video-poster-v1.png',
          ]
          commits=subprocess.check_output(['git','rev-list','--all'],text=True).splitlines()
          result={target:[] for target in targets}
          for commit in commits:
            for target in targets:
              variants=[target,f'v207-site/{target}',f'dist/{target}']
              for p in variants:
                proc=subprocess.run(['git','cat-file','-e',f'{commit}:{p}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                if proc.returncode: continue
                blob=subprocess.check_output(['git','rev-parse',f'{commit}:{p}'],text=True).strip()
                size=int(subprocess.check_output(['git','cat-file','-s',blob],text=True).strip())
                if not any(x['blob']==blob for x in result[target]):
                  msg=subprocess.check_output(['git','show','-s','--format=%s',commit],text=True,errors='replace').strip()
                  result[target].append({'commit':commit,'path':p,'blob':blob,'size':size,'message':msg})
          out=Path('assets/home-hero-build-inspection')
          out.mkdir(exist_ok=True)
          (out/'exact-missing-assets-history.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Commit exact history report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MagicOffice Build Bot'
          git config user.email 'sasta02001@gmail.com'
          git add assets/home-hero-build-inspection/exact-missing-assets-history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact missing v3 asset history'
            git push origin HEAD:main
          fi
