name: Repair and verify VX website
on:
  push:
    branches: [vx-maintenance]
    paths: ['vx-maintenance/request.json', 'vx-maintenance/*.mjs', 'vx-maintenance/*.py', 'vx-maintenance/privacy-plan.json', '.github/workflows/vx-maintenance.yml']
permissions:
  contents: read
concurrency:
  group: vx-website-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select requested operation
        id: request
        run: node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('vx-maintenance/request.json'));if(!['check','repair','inspect','refine-preview'].includes(r.mode))throw Error('Unknown mode');fs.appendFileSync(process.env.GITHUB_OUTPUT,'mode='+r.mode+'\n')"
      - name: Verify maintenance safeguards
        run: node --test vx-maintenance/repair.test.mjs
      - name: Inspect current VX source and staged privacy files
        if: steps.request.outputs.mode == 'inspect'
        env:
          VERCEL_TOKEN: ${{ secrets.MAGICOFFICE }}
        run: node vx-maintenance/inspect.mjs
      - uses: actions/setup-python@v5
        if: steps.request.outputs.mode == 'repair'
        with:
          python-version: '3.12'
      - name: Prepare video processing dependencies
        if: steps.request.outputs.mode == 'repair'
        run: |
          python -m pip install opencv-python-headless==4.12.0.88 numpy==2.2.6
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
      - name: Reproduce and validate approved face masks
        if: steps.request.outputs.mode == 'repair'
        run: python vx-maintenance/render-privacy.py --origin https://vxsagittarius.vercel.app --output /tmp/vx-privacy --rules vx-maintenance/privacy-plan.json
      - uses: actions/setup-python@v5
        if: steps.request.outputs.mode == 'refine-preview'
        with:
          python-version: '3.11'
      - name: Prepare hair-aware refinement dependencies
        if: steps.request.outputs.mode == 'refine-preview'
        run: |
          python -m pip install numpy==1.26.4 opencv-contrib-python==4.11.0.86 mediapipe==0.10.21 onnxruntime==1.23.2
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          mkdir -p work/models
          curl --fail --location --retry 3 https://github.com/yakhyo/face-parsing/releases/download/weights/resnet18.onnx -o work/models/resnet18.onnx
      - name: Render original-resolution hair-aware review set
        if: steps.request.outputs.mode == 'refine-preview'
        run: |
          python vx-maintenance/download-originals.py
          python vx-maintenance/render-refinement.py --source work/sources --output /tmp/vx-refined-media --model work/models/resnet18.onnx
      - name: Save refinement for visual review without publishing
        if: steps.request.outputs.mode == 'refine-preview'
        uses: actions/upload-artifact@v4
        with:
          name: vx-refined-media
          path: /tmp/vx-refined-media
          if-no-files-found: error
          retention-days: 7
      - name: Publish complete verified privacy media
        if: steps.request.outputs.mode == 'repair'
        env:
          VERCEL_TOKEN: ${{ secrets.MAGICOFFICE }}
        run: node vx-maintenance/upload-media.mjs /tmp/vx-privacy
      - name: Switch verified content routes and correct copy
        if: steps.request.outputs.mode == 'repair'
        env:
          VERCEL_TOKEN: ${{ secrets.MAGICOFFICE }}
        run: |
          node -e "const fs=require('fs');const p='vx-maintenance/request.json';const r=JSON.parse(fs.readFileSync(p));r.privacyDeploymentId=JSON.parse(fs.readFileSync('vx-maintenance/media-receipt.json')).deploymentId;fs.writeFileSync(p,JSON.stringify(r));"
          node vx-maintenance/repair.mjs
      - name: Verify public pages and privacy media routes
        if: steps.request.outputs.mode != 'inspect' && steps.request.outputs.mode != 'refine-preview'
        run: node vx-maintenance/check.mjs
      - name: Save verified result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vx-maintenance-receipt
          path: |
            vx-maintenance/inspection.json
            vx-maintenance/media-receipt.json
            vx-maintenance/receipt.json
            vx-maintenance/privacy-assets.json
            vx-maintenance/check-result.json
          if-no-files-found: warn
          retention-days: 30
