name: Verify MagicOffice v2.0.7 live Preview RC2

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.7-preview-source
    paths:
      - '.github/workflows/v207-live-preview-qa.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: https://magicoffice-v207-preview-rc2.vercel.app/
      EXPECTED_VERSION: 2.0.7-preview-verification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.7-preview-source
          fetch-depth: 0
      - name: Install Playwright browsers
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run cross-engine and cross-device QA
        shell: bash
        run: |
          cat > v207-live-qa.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium, webkit } from 'playwright';

          const target = process.env.TARGET_URL;
          const expected = process.env.EXPECTED_VERSION;
          const cases = [
            {name:'desktop-chromium', engine:'chromium', width:1366, height:900, mobile:false, touch:false},
            {name:'tablet-chromium', engine:'chromium', width:1024, height:768, mobile:false, touch:true},
            {name:'android-chromium', engine:'chromium', width:360, height:800, mobile:true, touch:true, ua:'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Mobile Safari/537.36'},
            {name:'small-android-chromium', engine:'chromium', width:320, height:568, mobile:true, touch:true, ua:'Mozilla/5.0 (Linux; Android 14; SM-A5460) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Mobile Safari/537.36'},
            {name:'iphone-webkit', engine:'webkit', width:390, height:844, mobile:true, touch:true, ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.7 Mobile/15E148 Safari/604.1'},
            {name:'iphone-large-webkit', engine:'webkit', width:430, height:932, mobile:true, touch:true, ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.7 Mobile/15E148 Safari/604.1'}
          ];

          const browsers = {
            chromium: await chromium.launch({headless:true}),
            webkit: await webkit.launch({headless:true})
          };
          const results = [];
          const coreText = ['魔幻姶仕社','姶仕名錄','本週出勤','活動快報','服務價目','立即訂位','線上購拍'];
          const quickText = ['姶仕名錄','本週出勤','線上購拍','活動快報','服務價目','立即訂位'];

          try {
            for (const item of cases) {
              const browser = browsers[item.engine];
              const context = await browser.newContext({
                viewport:{width:item.width,height:item.height},
                screen:{width:item.width,height:item.height},
                userAgent:item.ua,
                isMobile:item.mobile,
                hasTouch:item.touch,
                locale:'zh-TW',
                timezoneId:'Asia/Taipei',
                serviceWorkers:'block'
              });
              const page = await context.newPage();
              const pageErrors = [];
              const localFailures = [];
              page.on('pageerror', error => pageErrors.push(String(error?.stack || error)));
              page.on('requestfailed', request => {
                const url = request.url();
                if (url.includes('magicoffice-v207-preview-rc2') || url.includes('raw.githubusercontent.com/sasta02001-hash/magicoffice-deploy')) {
                  localFailures.push({url, error:request.failure()?.errorText || 'unknown'});
                }
              });

              const response = await page.goto(`${target}?qa=${Date.now()}-${item.name}`, {waitUntil:'domcontentloaded', timeout:120000});
              await page.waitForFunction(version => {
                const current = document.body?.dataset?.siteVersion || document.documentElement?.dataset?.siteVersion || document.querySelector('meta[name="x-magicoffice-preview"]')?.content || '';
                return current === version && document.body?.innerText?.includes('魔幻姶仕社');
              }, expected, {timeout:120000});
              await page.waitForTimeout(1200);
              await page.evaluate(() => {
                for (const image of document.images) {
                  image.loading = 'eager';
                  image.decoding = 'sync';
                }
              });
              const fullHeight = await page.evaluate(() => Math.max(document.body.scrollHeight, document.documentElement.scrollHeight));
              for (let y=0; y<=fullHeight; y+=700) {
                await page.evaluate(value => scrollTo(0, value), y);
                await page.waitForTimeout(35);
              }
              await page.evaluate(() => scrollTo(0,0));
              await page.waitForTimeout(1600);

              const state = await page.evaluate(({expected, coreText, quickText, mobile, width}) => {
                const body = getComputedStyle(document.body);
                const firstLink = document.querySelector('a');
                const firstLinkStyle = firstLink ? getComputedStyle(firstLink) : null;
                const imgs = [...document.images];
                const text = document.body.innerText;
                const version = document.body?.dataset?.siteVersion || document.documentElement?.dataset?.siteVersion || document.querySelector('meta[name="x-magicoffice-preview"]')?.content || '';
                const fixedContainers = [...document.querySelectorAll('body *')].filter(element => {
                  const style = getComputedStyle(element);
                  if (style.position !== 'fixed' || style.display === 'none' || style.visibility === 'hidden') return false;
                  const content = element.innerText || '';
                  return quickText.every(label => content.includes(label));
                });
                const fixedLineLinks = [...document.querySelectorAll('a[href*="lin.ee"]')].filter(element => {
                  const style = getComputedStyle(element);
                  const rect = element.getBoundingClientRect();
                  return style.position === 'fixed' && style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
                });
                const scheduleText = document.querySelector('#schedule')?.innerText || '';
                const robots = document.querySelector('meta[name="robots"]')?.content || '';
                const external = [...document.querySelectorAll('a[href]')].map(link => link.href);
                return {
                  version,
                  expectedVersion: version === expected,
                  title: document.title,
                  background: body.backgroundColor,
                  font: body.fontFamily,
                  rawBlueLink: Boolean(firstLinkStyle && firstLinkStyle.color === 'rgb(0, 0, 238)' && firstLinkStyle.textDecorationLine.includes('underline')),
                  viewportWidth: innerWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  noHorizontalOverflow: document.documentElement.scrollWidth <= innerWidth + 2,
                  imageCount: imgs.length,
                  brokenImages: imgs.filter(image => !image.complete || image.naturalWidth <= 0).map(image => image.alt || image.currentSrc || image.src),
                  coreText: Object.fromEntries(coreText.map(label => [label, text.includes(label)])),
                  quickNavVisible: fixedContainers.length > 0,
                  fixedLineVisible: fixedLineLinks.length > 0,
                  scheduleReferencesInstagram: /Instagram|官方\s*IG|以\s*IG\s*為準/i.test(scheduleText),
                  robotsNoindex: /noindex/i.test(robots),
                  hasLine: external.some(url => url.includes('lin.ee/NcCGG1P')),
                  hasInstagram: external.some(url => url.includes('instagram.com/maid_magicoffice')),
                  hasReservation: external.some(url => url.includes('gforms.app/r/71hSwQR')),
                  mobile,
                  width
                };
              }, {expected, coreText, quickText, mobile:item.mobile, width:item.width});

              let menu = {required:item.width <= 1180, opened:true, closed:true, lineEntry:true};
              if (menu.required) {
                const toggle = page.locator('.menu-toggle').first();
                menu.toggleFound = await toggle.count() > 0;
                if (menu.toggleFound) {
                  await toggle.click();
                  await page.waitForTimeout(350);
                  menu.opened = await page.evaluate(() => {
                    const toggle = document.querySelector('.menu-toggle');
                    const nav = document.querySelector('.main-nav');
                    if (!toggle || !nav) return false;
                    const style = getComputedStyle(nav);
                    const rect = nav.getBoundingClientRect();
                    return toggle.getAttribute('aria-expanded') === 'true' && style.display !== 'none' && style.visibility !== 'hidden' && rect.width > 0 && rect.height > 0;
                  });
                  menu.lineEntry = await page.evaluate(() => Boolean([...document.querySelectorAll('.main-nav a')].find(link => (link.textContent || '').includes('LINE 官方'))));
                  await page.screenshot({path:`qa-${item.name}-menu.png`, fullPage:false});
                  await toggle.click();
                  await page.waitForTimeout(250);
                  menu.closed = await page.evaluate(() => document.querySelector('.menu-toggle')?.getAttribute('aria-expanded') === 'false');
                } else {
                  menu.opened = false;
                  menu.closed = false;
                  menu.lineEntry = false;
                }
              }

              await page.screenshot({path:`qa-${item.name}-top.png`, fullPage:false});
              const checks = {
                http200: response?.status() === 200,
                expectedVersion: state.expectedVersion,
                brandedTitle: state.title.includes('MagicOffice'),
                styled: !['rgba(0, 0, 0, 0)','rgb(255, 255, 255)'].includes(state.background) && Boolean(state.font),
                notRawHtml: !state.rawBlueLink,
                responsive: state.noHorizontalOverflow,
                imagesLoaded: state.imageCount >= 40 && state.brokenImages.length === 0,
                coreContent: Object.values(state.coreText).every(Boolean),
                quickNavRule: item.width > 1180 ? true : state.quickNavVisible,
                lineFloatRule: item.width > 1180 ? state.fixedLineVisible : !state.fixedLineVisible,
                attendanceChannel: !state.scheduleReferencesInstagram,
                robotsNoindex: state.robotsNoindex,
                lineLink: state.hasLine,
                instagramLink: state.hasInstagram,
                reservationLink: state.hasReservation,
                menuOpened: !menu.required || menu.opened,
                menuClosed: !menu.required || menu.closed,
                menuLineEntry: !menu.required || menu.lineEntry,
                noPageErrors: pageErrors.length === 0,
                noLocalRequestFailures: localFailures.length === 0
              };
              const failures = Object.entries(checks).filter(([,value]) => !value).map(([key]) => key);
              results.push({
                name:item.name,
                engine:item.engine,
                viewport:{width:item.width,height:item.height},
                passed:failures.length === 0,
                checks,
                failures,
                state,
                menu,
                pageErrors,
                localFailures,
                responseStatus:response?.status() || 0
              });
              await context.close();
            }
          } finally {
            await browsers.chromium.close();
            await browsers.webkit.close();
          }

          const report = {
            version:expected,
            target,
            generatedAt:new Date().toISOString(),
            timezone:'Asia/Taipei',
            productionModified:false,
            attendanceSpreadsheetModified:false,
            testedCases:results.length,
            passedCases:results.filter(result => result.passed).length,
            failedCases:results.filter(result => !result.passed).length,
            releaseGate:{previewReviewAllowed:results.every(result => result.passed), productionAllowed:false, productionBlocker:'Three original visual assets remain replaced by clearly marked Preview-only fallbacks.'},
            results
          };
          fs.mkdirSync('v207-analysis',{recursive:true});
          fs.writeFileSync('v207-analysis/live-preview-qa.json', JSON.stringify(report,null,2));
          console.log('MAGICOFFICE_V207_LIVE_QA', JSON.stringify({testedCases:report.testedCases,passedCases:report.passedCases,failedCases:report.failedCases,previewReviewAllowed:report.releaseGate.previewReviewAllowed}));
          if (report.failedCases > 0) process.exit(1);
          JS
          node v207-live-qa.mjs
      - name: Commit QA report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f v207-analysis/live-preview-qa.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v207-analysis/live-preview-qa.json
          if git diff --cached --quiet; then
            echo 'No live QA report changes.'
          else
            git commit -m 'Verify MagicOffice v2.0.7 live Preview RC2'
            git pull --rebase origin v2.0.7-preview-source
            git push origin HEAD:v2.0.7-preview-source
          fi
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_v2.0.7_Preview_RC2_live_QA
          path: |
            v207-analysis/live-preview-qa.json
            qa-*.png
          if-no-files-found: warn
          retention-days: 14
