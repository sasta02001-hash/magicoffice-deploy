name: Publish VX ART Location Map
on:
  push:
    branches: [vx-maintenance]
    paths: ['vx-map-20261006/**', '.github/workflows/vx-map-20261006.yml']
permissions:
  contents: read
concurrency:
  group: vx-website-maintenance
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify map and preservation safeguards
        run: node --test vx-map-20261006/map.test.mjs vx-maintenance/repair.test.mjs vx-maintenance/refinement.test.mjs vx-maintenance/range-check.test.mjs vx-maintenance/resume.test.mjs
      - name: Install isolated browser verification dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/vx-browser" --no-audit --no-fund playwright@1.58.2 agent-browser@0.38.2
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify rendered maps before publishing
        run: |
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$RUNNER_TEMP/vx-browser/node_modules"
          export VX_BROWSER_EXECUTABLE="$(command -v google-chrome)"
          test -x "$VX_BROWSER_EXECUTABLE"
          node vx-map-20261006/preview.mjs > "$RUNNER_TEMP/vx-map-preview.log" 2>&1 &
          "$RUNNER_TEMP/vx-browser/node_modules/.bin/agent-browser" --executable-path "$VX_BROWSER_EXECUTABLE" open http://127.0.0.1:4173/booking/
          "$RUNNER_TEMP/vx-browser/node_modules/.bin/agent-browser" wait --load networkidle
          "$RUNNER_TEMP/vx-browser/node_modules/.bin/agent-browser" screenshot /tmp/vx-map-agent-initial.png
          "$RUNNER_TEMP/vx-browser/node_modules/.bin/agent-browser" snapshot -i
          "$RUNNER_TEMP/vx-browser/node_modules/.bin/agent-browser" errors
          "$RUNNER_TEMP/vx-browser/node_modules/.bin/agent-browser" close
          node vx-map-20261006/verify-browser.mjs
      - name: Publish original map to existing VX official projects
        env:
          VERCEL_TOKEN: ${{ secrets.MAGICOFFICE }}
        run: node vx-map-20261006/publish.mjs
      - name: Verify live official maps
        run: |
          export CODEX_PRIMARY_RUNTIME_NODE_MODULES="$RUNNER_TEMP/vx-browser/node_modules"
          export VX_BROWSER_EXECUTABLE="$(command -v google-chrome)"
          node vx-map-20261006/verify-browser.mjs https://vxsagittarius.vercel.app
      - name: Save map publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vx-map-20261006-receipt
          path: |
            vx-map-20261006/*verification.json
            vx-map-20261006/publication-receipt.json
            /tmp/vx-map-*.png
          if-no-files-found: warn
          retention-days: 30
