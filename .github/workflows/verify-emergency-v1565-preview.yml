name: Verify MagicOffice emergency stable v1.5.6.5 preview

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-emergency-v1565-preview.yml'

permissions:
  contents: read

env:
  TARGET_URL: https://magicoffice-emergency-v1565-test.vercel.app/

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test Android Chrome and Threads WebView
        shell: bash
        run: |
          cat > test.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const url=process.env.TARGET_URL;
          const cases=[
            ['android-chrome','Mozilla/5.0 (Linux; Android 15; Pixel 9 Pro) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Mobile Safari/537.36'],
            ['threads-webview','Mozilla/5.0 (Linux; Android 15; SM-S9280 Build/AP3A.240905.015.A2; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/139.0.0.0 Mobile Safari/537.36 [FB_IAB/Orca-Android;FBAV/475.0.0.0.0;]']
          ];
          const browser=await chromium.launch({headless:true});
          const results=[];
          try{
            for(const [name,ua] of cases){
              const context=await browser.newContext({userAgent:ua,viewport:{width:390,height:844},screen:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true,locale:'zh-TW',timezoneId:'Asia/Taipei',serviceWorkers:'block'});
              const page=await context.newPage();
              const pageErrors=[],failedLocal=[];
              page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
              page.on('requestfailed',r=>{if(r.url().startsWith(url))failedLocal.push({url:r.url(),error:r.failure()?.errorText||'unknown'})});
              const response=await page.goto(`${url}?verify=${Date.now()}-${name}`,{waitUntil:'domcontentloaded',timeout:120000});
              await page.evaluate(()=>{for(const i of document.images){i.loading='eager';i.decoding='sync'}});
              const height=await page.evaluate(()=>Math.max(document.body.scrollHeight,document.documentElement.scrollHeight));
              for(let y=0;y<=height;y+=650){await page.evaluate(v=>scrollTo(0,v),y);await page.waitForTimeout(50)}
              await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(1800);
              const state=await page.evaluate(()=>{
                const body=getComputedStyle(document.body),link=document.querySelector('a'),ls=link?getComputedStyle(link):null,imgs=[...document.images];
                const text=document.body.innerText;
                return {version:document.body.dataset.siteVersion||document.documentElement.dataset.siteVersion||'',background:body.backgroundColor,font:body.fontFamily,rawBlue:Boolean(ls&&ls.color==='rgb(0, 0, 238)'&&ls.textDecorationLine.includes('underline')),imageCount:imgs.length,broken:imgs.filter(i=>!i.complete||i.naturalWidth<=0).map(i=>i.alt||i.src.slice(0,60)),viewport:innerWidth,scroll:document.documentElement.scrollWidth,externalCss:[...document.querySelectorAll('link[rel~="stylesheet"][href]')].map(x=>x.href),externalJs:[...document.querySelectorAll('script[src]')].map(x=>x.src),header:getComputedStyle(document.querySelector('.site-header')).display,hero:getComputedStyle(document.querySelector('.hero')).display,content:['魔幻姶仕社','姶仕名錄','本週出勤','中秋月宴','柚子 9/19 生誕','香檳累積贈禮','退款／訂位取消與異動','線上購拍','活動快報','服務價目','立即預約'].every(x=>text.includes(x))};
              });
              const card=page.locator('.cast-card[data-profile="mibao"]').first();
              const cardFound=await card.count()>0;
              if(cardFound){await card.evaluate(e=>e.click());await page.waitForTimeout(700)}
              const mibao=await page.evaluate(()=>{const d=document.querySelector('#profile-dialog'),c=document.querySelector('#profile-content'),i=c?.querySelector('img');return{open:Boolean(d?.open||d?.hasAttribute('open')),heading:c?.querySelector('h2')?.textContent?.trim()||'',loaded:Boolean(i&&i.complete&&i.naturalWidth>0),width:i?.naturalWidth||0,height:i?.naturalHeight||0}});
              await page.screenshot({path:`${name}-top.png`});
              await page.evaluate(()=>document.querySelector('#profile-dialog')?.close?.()).catch(()=>{});
              const checks={http200:response?.status()===200,version:state.version==='1.5.6.5-emergency-stable',styled:!['rgba(0, 0, 0, 0)','rgb(255, 255, 255)'].includes(state.background)&&Boolean(state.font),notRaw:!state.rawBlue,header:state.header!=='inline'&&state.header!=='none',hero:state.hero!=='none',images:state.imageCount>=40&&state.broken.length===0,responsive:state.scroll<=state.viewport+2,selfContained:state.externalCss.length===0&&state.externalJs.length===0,content:state.content,mibao:cardFound&&mibao.open&&mibao.heading.includes('咪寶')&&mibao.loaded&&mibao.width===600&&mibao.height===800,noPageErrors:pageErrors.length===0,noLocalFailures:failedLocal.length===0};
              const failures=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
              results.push({name,passed:failures.length===0,checks,failures,state,mibao,pageErrors,failedLocal,status:response?.status()||0});
              await context.close();
            }
          }finally{await browser.close()}
          fs.writeFileSync('report.json',JSON.stringify(results,null,2));
          console.log('MAGICOFFICE_V1565_PREVIEW',JSON.stringify(results));
          if(results.some(r=>!r.passed))process.exit(1);
          JS
          node test.mjs
      - name: Upload report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_v1565_preview_verification
          path: |
            report.json
            android-chrome-top.png
            threads-webview-top.png
          if-no-files-found: warn
          retention-days: 14
