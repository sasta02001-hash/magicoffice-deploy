name: Deploy v4.3.11 audible-first hero video

on:
  push:
    paths:
      - .github/workflows/deploy-v4311-audible-autoplay.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE: magicoffice-v4.3.11-audible-autoplay-2026-09-03
      VERCEL_ORG_ID: team_44tkvxP20I5s9SUmlxfUEQM1
      VERCEL_PROJECT_ID: prj_JcF9cms6IGKkWJJsCaOWkwVVzA9D
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply source migration
        run: python website-v4/scripts/apply-v4311-audible.py

      - name: Validate and build
        working-directory: website-v4
        run: |
          set -euo pipefail
          npm run check
          npm run test:data
          npm run build:offline
          node -e "const fs=require('fs');const h=fs.readFileSync('dist/index.html','utf8');const v=(h.match(/<video[^>]*data-default-audio=\"audible\"[^>]*>/)||[])[0]||'';if(!h.includes(process.env.RELEASE)||!v.includes('autoplay')||!v.includes('controls')||/\\smuted(?:=|\\s|>)/.test(v)||/\\sloop(?:=|\\s|>)/.test(v)||h.includes('data-video-start')||h.includes('mo-video-sound-overlay'))process.exit(1);"

      - name: Preserve maintained source
        run: |
          set -euo pipefail
          git config user.name "MagicOffice website maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website-v4
          git reset website-v4/assets/video/*.mp4 website-v4/dist website-v4/verification 2>/dev/null || true
          git commit -m "Default the hero video to audible-first autoplay with poster fallback"
          git push origin HEAD:main

      - name: Deploy to existing production project
        id: production
        working-directory: website-v4
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_44tkvxP20I5s9SUmlxfUEQM1","projectId":"prj_JcF9cms6IGKkWJJsCaOWkwVVzA9D"}' > .vercel/project.json
          npx --yes vercel@59.3.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          URL="$(npx --yes vercel@59.3.0 deploy --yes --prod --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$URL" > ../v4311-production-url.txt

      - name: Verify official domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            curl -fsS "https://magicoffice.vercel.app/?verify=v4311-${attempt}" -o /tmp/index.html || true
            if grep -q "$RELEASE" /tmp/index.html 2>/dev/null; then break; fi
            sleep 5
          done
          grep -q "$RELEASE" /tmp/index.html
          python -c 'from pathlib import Path;import re;h=Path("/tmp/index.html").read_text();m=re.search(r"<video[^>]*data-default-audio=\"audible\"[^>]*>",h);assert m;v=m.group(0);assert "autoplay" in v and "controls" in v and "poster=" in v;assert not re.search(r"\smuted(?:=|\s|>)",v);assert not re.search(r"\sloop(?:=|\s|>)",v);assert "data-video-start" not in h and "mo-video-sound-overlay" not in h;assert "MagiCofficec魔幻世界人物誌" in h'
          curl -fsSI "https://magicoffice.vercel.app/assets/css/video-audio-v4.3.11.css" | grep -q "200"
          printf 'release=%s\ndeployment=%s\nverified_at=%s\n' "$RELEASE" '${{ steps.production.outputs.url }}' "$(date -u +%FT%TZ)" > v4311-production-receipt.txt

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_v4311_AUDIBLE_AUTOPLAY_receipt
          path: |
            v4311-production-url.txt
            v4311-production-receipt.txt
            website-v4/verification/static-validation.json
          if-no-files-found: warn
          retention-days: 14
