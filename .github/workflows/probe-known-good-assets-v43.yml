name: Inspect verified standalone assets for clean v4.3 replacement

on:
  push:
    paths:
      - '.github/workflows/probe-known-good-assets-v43.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified complete standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: MagicOffice_v1.5.6_FULL_STANDALONE_HTML
          path: /tmp/known-good
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: sasta02001-hash/magicoffice-deploy
          run-id: 32955866954

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check --quiet beautifulsoup4 pillow

      - name: Build exact embedded-image inventory
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from PIL import Image
          import base64, hashlib, io, json, re

          source = Path('/tmp/known-good/MagicOffice_v1.5.6_FULL_STANDALONE.html')
          expected_size = 14609242
          expected_sha = 'ea08c6f4b74293f8bb29e2f8eae42ede564ed197de054b4d4bbf5d97961e08e4'
          data = source.read_bytes()
          actual_sha = hashlib.sha256(data).hexdigest()
          if len(data) != expected_size or actual_sha != expected_sha:
              raise SystemExit(f'Known-good artifact verification failed bytes={len(data)} sha={actual_sha}')

          text = data.decode('utf-8')
          soup = BeautifulSoup(text, 'html.parser')
          records = []
          seen_payloads = {}

          for index, img in enumerate(soup.find_all('img')):
              src = img.get('src') or ''
              record = {
                  'index': index,
                  'alt': img.get('alt') or '',
                  'class': img.get('class') or [],
                  'widthAttr': img.get('width'),
                  'heightAttr': img.get('height'),
                  'sourceKind': 'data' if src.startswith('data:image/') else 'url',
                  'sourcePreview': src[:180] if not src.startswith('data:image/') else src.split(',',1)[0],
              }
              if src.startswith('data:image/'):
                  header, payload = src.split(',', 1)
                  mime = header.split(';', 1)[0].split(':', 1)[1]
                  raw = base64.b64decode(payload)
                  digest = hashlib.sha256(raw).hexdigest()
                  record.update({'mime': mime, 'bytes': len(raw), 'sha256': digest})
                  try:
                      with Image.open(io.BytesIO(raw)) as image:
                          record['actualWidth'] = image.width
                          record['actualHeight'] = image.height
                          record['format'] = image.format
                  except Exception as exc:
                      record['imageError'] = str(exc)
                  seen_payloads.setdefault(digest, []).append(index)
              parent = img.parent
              for _ in range(4):
                  if parent is None:
                      break
                  parent_id = parent.get('id') if getattr(parent, 'get', None) else None
                  parent_class = parent.get('class') if getattr(parent, 'get', None) else None
                  if parent_id or parent_class:
                      record.setdefault('ancestors', []).append({'tag': parent.name, 'id': parent_id, 'class': parent_class or []})
                  parent = parent.parent
              records.append(record)

          css_records = []
          for match_index, match in enumerate(re.finditer(r'data:image/([^;]+);base64,([A-Za-z0-9+/=]+)', text)):
              raw = base64.b64decode(match.group(2))
              digest = hashlib.sha256(raw).hexdigest()
              item = {'index': match_index, 'mime': 'image/' + match.group(1), 'bytes': len(raw), 'sha256': digest}
              try:
                  with Image.open(io.BytesIO(raw)) as image:
                      item.update({'actualWidth': image.width, 'actualHeight': image.height, 'format': image.format})
              except Exception as exc:
                  item['imageError'] = str(exc)
              css_records.append(item)

          duplicate_groups = [indexes for indexes in seen_payloads.values() if len(indexes) > 1]
          report = {
              'source': source.name,
              'sourceBytes': len(data),
              'sourceSha256': actual_sha,
              'imgTagCount': len(records),
              'embeddedImgTagCount': sum(1 for record in records if record['sourceKind'] == 'data'),
              'cssDataImageOccurrenceCount': len(css_records),
              'duplicateImgPayloadGroups': duplicate_groups,
              'images': records,
              'allDataImageOccurrences': css_records,
          }
          out = Path('rebuild-v43/known-good-asset-report.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')

          lines = []
          for record in records:
              if record['sourceKind'] != 'data':
                  continue
              lines.append(
                  f"{record['index']:03d}\t{record.get('actualWidth','?')}x{record.get('actualHeight','?')}\t"
                  f"{record.get('bytes',0)}\t{record.get('sha256','')[:12]}\t"
                  f"ALT={record.get('alt','')}\tCLASS={' '.join(record.get('class',[]))}\t"
                  f"ANCESTORS={json.dumps(record.get('ancestors',[]), ensure_ascii=False)}"
              )
          Path('rebuild-v43/known-good-asset-report.txt').write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))
          print('KNOWN_GOOD_ASSET_REPORT_OK', json.dumps({
              'imgTagCount': report['imgTagCount'],
              'embeddedImgTagCount': report['embeddedImgTagCount'],
              'cssDataImageOccurrenceCount': report['cssDataImageOccurrenceCount'],
              'duplicateGroups': len(duplicate_groups),
          }, ensure_ascii=False))
          PY

      - name: Commit inspection report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MagicOffice Asset Inspector'
          git config user.email 'sasta02001@gmail.com'
          git add rebuild-v43/known-good-asset-report.json rebuild-v43/known-good-asset-report.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record verified standalone asset inventory for v4.3 replacement'
            git push origin HEAD:main
          fi

      - name: Upload report evidence
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_v4.3_known_good_asset_report
          path: |
            rebuild-v43/known-good-asset-report.json
            rebuild-v43/known-good-asset-report.txt
          retention-days: 14
