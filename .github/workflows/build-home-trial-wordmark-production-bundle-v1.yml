name: Build verified MagicOffice production bundle with wordmark and trial video v1

on:
  push:
    paths:
      - '.github/workflows/build-home-trial-wordmark-production-bundle-v1.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild approved v3 homepage from current Production
        shell: bash
        run: |
          set -euo pipefail
          cat assets/home-hero-patch-v1/part-00.txt assets/home-hero-patch-v1/part-01.txt > /tmp/home-hero-builder.js
          node --check /tmp/home-hero-builder.js
          rm -rf dist
          node /tmp/home-hero-builder.js
          test -f dist/index.html
          test -f dist/health.json
          test -f assets/home-hero-preview-v3/preview.html

      - name: Download checksum-locked 12-second 720p trial video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/assets/video
          python -m pip install --quiet gdown
          gdown 'https://drive.google.com/uc?id=1N_fLCYLL-FPJp_bU7W33jPHHHL129H3K' -O dist/assets/video/MagicOffice_home_trial_720p_12s_v1.mp4
          test "$(stat -c%s dist/assets/video/MagicOffice_home_trial_720p_12s_v1.mp4)" = '3016896'
          test "$(sha256sum dist/assets/video/MagicOffice_home_trial_720p_12s_v1.mp4 | cut -d' ' -f1)" = '2251aa3eb1d386a4d3a889ab147f7a212838e7f1c56bcac018e92fb44bc5f7b1'

      - name: Apply approved decorated wordmark and native trial playback
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import json, re

          RELEASE = 'home-hero-wordmark-trial-video-2026-09-01-v1'
          VIDEO = '/assets/video/MagicOffice_home_trial_720p_12s_v1.mp4'
          CACHE = '20260901-trial12s-v1'

          page = Path('dist/index.html')
          approved_page = Path('assets/home-hero-preview-v3/preview.html')
          html = page.read_text(encoding='utf-8')
          approved = approved_page.read_text(encoding='utf-8')

          def pick(pattern, label):
              m = re.search(pattern, approved, re.I | re.S)
              if not m:
                  raise SystemExit(f'Missing approved {label}')
              return m.group(0)

          wordmark_meta = pick(r'<meta\s+name=["\']x-magicoffice-home-video-wordmark["\'][^>]*>', 'wordmark meta')
          wordmark_style = pick(r'<style\s+id=["\']magicoffice-home-video-wordmark-v1["\']>[\s\S]*?</style>', 'wordmark style')
          wordmark = pick(r'<div\s+class=["\']home-video-wordmark["\'][^>]*>[\s\S]*?</div>', 'wordmark overlay')

          # Idempotent cleanup. Do not alter any unrelated section.
          html = re.sub(r'<meta\s+name=["\']x-magicoffice-home-video-wordmark["\'][^>]*>', '', html, flags=re.I)
          html = re.sub(r'<meta\s+name=["\']x-magicoffice-home-production-release["\'][^>]*>', '', html, flags=re.I)
          html = re.sub(r'<style\s+id=["\']magicoffice-home-video-wordmark-v1["\']>[\s\S]*?</style>', '', html, flags=re.I)
          html = re.sub(r'<style\s+id=["\']magicoffice-home-trial-video-v1["\']>[\s\S]*?</style>', '', html, flags=re.I)
          html = re.sub(r'<script\s+id=["\']magicoffice-home-trial-video-v1-js["\'][^>]*>[\s\S]*?</script>', '', html, flags=re.I)
          html = re.sub(r'<div\s+class=["\']home-video-wordmark["\'][^>]*>[\s\S]*?</div>', '', html, flags=re.I)

          trial_style = '''<style id="magicoffice-home-trial-video-v1">
          .home-trial-video{position:absolute!important;inset:0!important;display:block!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;background:#12090c!important}
          .homepage-cinema-stage[data-video-ready="false"] .home-trial-video{opacity:0!important}
          .homepage-cinema-stage[data-video-ready="true"] .home-trial-video{opacity:1!important}
          @media(max-width:960px){.cinema-fullscreen-button{display:none!important}.home-trial-video{object-fit:cover!important}}
          </style>'''
          production_meta = f'<meta name="x-magicoffice-home-production-release" content="{RELEASE}"/>'
          if '</head>' not in html:
              raise SystemExit('Missing </head>')
          html = html.replace('</head>', production_meta + wordmark_meta + wordmark_style + trial_style + '</head>', 1)

          poster_re = re.compile(r'(<img\b[^>]*class=["\'][^"\']*\bhome-video-poster\b[^"\']*["\'][^>]*>)', re.I)
          poster = poster_re.search(html)
          if not poster:
              raise SystemExit('Poster element not found')
          html = html[:poster.end()] + wordmark + html[poster.end():]

          mount_re = re.compile(r'<(?P<tag>div|section)(?P<attrs>[^>]*\bdata-home-video-mount\b[^>]*)>\s*</(?P=tag)>', re.I | re.S)
          mount = mount_re.search(html)
          if not mount:
              raise SystemExit('Empty video mount not found')
          tag = mount.group('tag')
          attrs = mount.group('attrs')
          attrs = re.sub(r'\saria-hidden\s*=\s*(["\']).*?\1', '', attrs, flags=re.I)
          attrs = re.sub(r'\sdata-home-trial-video\s*=\s*(["\']).*?\1', '', attrs, flags=re.I)
          video = (
              f'<video class="home-trial-video" controls muted loop playsinline webkit-playsinline '
              f'preload="metadata" disablepictureinpicture '
              f'poster="/assets/media/magicoffice-home-video-poster-v1.webp?v=20260901-home-hero-poster-v1">'
              f'<source src="{VIDEO}?v={CACHE}" type="video/mp4"/>'
              f'</video>'
          )
          replacement = f'<{tag}{attrs} data-home-trial-video="{RELEASE}" aria-hidden="false">{video}</{tag}>'
          html = html[:mount.start()] + replacement + html[mount.end():]

          # Desktop may autoplay muted. Mobile starts with the approved poster and native play control.
          script = f'''<script id="magicoffice-home-trial-video-v1-js">(()=>{{const boot=()=>{{const v=document.querySelector('.home-trial-video');if(!v)return;v.muted=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');if(matchMedia('(min-width:961px)').matches)v.play().catch(()=>{{}});}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{{once:true}});else boot();}})();</script>'''
          if '</body>' not in html:
              raise SystemExit('Missing </body>')
          html = html.replace('</body>', script + '</body>', 1)

          checks = {
              'release': RELEASE in html,
              'singleWordmark': html.count('class="home-video-wordmark"') == 1,
              'wordmark': 'data-wordmark="MAGICOFFICE"' in html,
              'trialVideo': html.count(f'{VIDEO}?v={CACHE}') == 1,
              'nativeControls': 'class="home-trial-video" controls muted loop playsinline webkit-playsinline' in html,
              'poster': 'magicoffice-home-video-poster-v1.webp' in html,
              'desktopBackground': 'desktop-clean-scene-2026-09-01-v1' in html,
              'ratio': '36fr' in html and '64fr' in html,
              'mobileNav': 'data-home-mobile-nav="four-core-links"' in html,
              'petals': html.count('class="mo-home-petal"') >= 6,
              'sections': all(marker in html for marker in ['id="roster"','id="schedule"','id="event-hub"','id="menu"','id="location"']),
          }
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('Bundle checks failed: ' + ', '.join(failed))
          page.write_text(html, encoding='utf-8')

          health_path = Path('dist/health.json')
          health = json.loads(health_path.read_text(encoding='utf-8'))
          health.update({
              'ok': True,
              'release': RELEASE,
              'wordmark': {
                  'text': 'MAGICOFFICE',
                  'source': 'user-approved decorated inline SVG from v3 preview',
                  'behavior': 'visible with poster; fades when playable video is shown'
              },
              'trialVideo': {
                  'path': VIDEO,
                  'width': 1280,
                  'height': 720,
                  'fps': 24,
                  'durationSeconds': 12,
                  'bytes': 3016896,
                  'sha256': '2251aa3eb1d386a4d3a889ab147f7a212838e7f1c56bcac018e92fb44bc5f7b1',
                  'behavior': 'native controls, muted, loop, playsinline; desktop autoplay attempt only'
              },
              'verification': checks
          })
          health_path.write_text(json.dumps(health, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('MAGICOFFICE_PRODUCTION_BUNDLE_V1_OK', json.dumps(checks))
          PY

      - name: Final file and content verification
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/assets/video/MagicOffice_home_trial_720p_12s_v1.mp4
          test "$(stat -c%s dist/assets/video/MagicOffice_home_trial_720p_12s_v1.mp4)" = '3016896'
          test "$(sha256sum dist/assets/video/MagicOffice_home_trial_720p_12s_v1.mp4 | cut -d' ' -f1)" = '2251aa3eb1d386a4d3a889ab147f7a212838e7f1c56bcac018e92fb44bc5f7b1'
          grep -q 'home-hero-wordmark-trial-video-2026-09-01-v1' dist/index.html
          grep -q 'data-wordmark="MAGICOFFICE"' dist/index.html
          grep -q 'MagicOffice_home_trial_720p_12s_v1.mp4?v=20260901-trial12s-v1' dist/index.html
          grep -q 'data-home-mobile-nav="four-core-links"' dist/index.html
          grep -q 'desktop-clean-scene-2026-09-01-v1' dist/index.html
          grep -q 'id="schedule"' dist/index.html
          grep -q 'id="event-hub"' dist/index.html
          grep -q 'id="menu"' dist/index.html
          du -sh dist
          find dist -type f | wc -l

      - name: Upload complete deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_home_wordmark_trial_video_production_bundle_v1
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
