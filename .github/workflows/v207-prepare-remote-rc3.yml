name: Prepare MagicOffice v2.0.7 remote Preview RC3

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.7-preview-source
    paths:
      - '.github/workflows/v207-prepare-remote-rc3.yml'
      - 'v207-rc1/prepare_remote_rc3.py'
      - 'v207-site/**'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.7-preview-source
          fetch-depth: 0
      - name: Build MIME-safe remote preview
        run: python v207-rc1/prepare_remote_rc3.py
      - name: Validate remote preview
        shell: bash
        run: |
          set -euo pipefail
          test -f v207-remote-preview/index.html
          test -f v207-remote-preview/remote-preview.json
          grep -q 'data-remote-preview="rc3"' v207-remote-preview/index.html
          grep -q 'data-site-version="2.0.7-preview-verification"' v207-remote-preview/index.html
          grep -q 'cdn.jsdelivr.net/gh/sasta02001-hash/magicoffice-deploy' v207-remote-preview/index.html
          ! grep -q 'raw.githubusercontent.com.*assets/css' v207-remote-preview/index.html
      - name: Commit remote Preview RC3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v207-remote-preview
          if git diff --cached --quiet; then
            echo 'No remote Preview RC3 changes.'
          else
            git commit -m 'Prepare MagicOffice v2.0.7 remote Preview RC3'
            git pull --rebase origin v2.0.7-preview-source
            git push origin HEAD:v2.0.7-preview-source
          fi
