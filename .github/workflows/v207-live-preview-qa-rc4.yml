name: Verify MagicOffice v2.0.7 live Preview RC3 corrected gate

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.7-preview-source
    paths:
      - '.github/workflows/v207-live-preview-qa-rc4.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: https://magicoffice-v207-preview-rc3.vercel.app/
      EXPECTED_VERSION: 2.0.7-preview-verification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.7-preview-source
          fetch-depth: 0
      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Run corrected live QA gate
        shell: bash
        run: |
          cat > qa-rc4.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium, webkit } from 'playwright';

          const target=process.env.TARGET_URL;
          const expected=process.env.EXPECTED_VERSION;
          const cases=[
            ['desktop-chromium','chromium',1366,900,false,false],
            ['tablet-chromium','chromium',1024,768,false,true],
            ['android-chromium','chromium',360,800,true,true],
            ['small-android-chromium','chromium',320,568,true,true],
            ['iphone-webkit','webkit',390,844,true,true],
            ['iphone-large-webkit','webkit',430,932,true,true]
          ];
          const engines={chromium:await chromium.launch({headless:true}),webkit:await webkit.launch({headless:true})};
          const results=[];
          const quickLabels=['姶仕名錄','本週出勤','線上購拍','活動快報','服務價目','立即訂位'];

          try{
            for(const [name,engine,width,height,mobile,touch] of cases){
              const context=await engines[engine].newContext({viewport:{width,height},screen:{width,height},isMobile:mobile,hasTouch:touch,locale:'zh-TW',timezoneId:'Asia/Taipei',serviceWorkers:'block'});
              const page=await context.newPage();
              const pageErrors=[],assetFailures=[];
              page.on('pageerror',error=>pageErrors.push(String(error?.stack||error)));
              page.on('requestfailed',request=>{const url=request.url();if(url.includes('magicoffice-v207-preview-rc3')||url.includes('cdn.jsdelivr.net/gh/sasta02001-hash/magicoffice-deploy')||url.includes('raw.githubusercontent.com/sasta02001-hash/magicoffice-deploy'))assetFailures.push({url,error:request.failure()?.errorText||'unknown'});});
              const response=await page.goto(`${target}?qa4=${Date.now()}-${name}`,{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForFunction(version=>{const current=document.body?.dataset?.siteVersion||document.documentElement?.dataset?.siteVersion||document.querySelector('meta[name="x-magicoffice-preview"]')?.content||'';return current===version&&document.documentElement?.dataset?.remotePreview==='rc3'&&document.body?.textContent?.includes('魔幻姶仕社');},expected,{timeout:120000});
              await page.waitForTimeout(1000);
              await page.evaluate(()=>{for(const image of document.images){image.loading='eager';image.decoding='sync';}});
              const fullHeight=await page.evaluate(()=>Math.max(document.body.scrollHeight,document.documentElement.scrollHeight));
              for(let y=0;y<=fullHeight;y+=700){await page.evaluate(value=>scrollTo(0,value),y);await page.waitForTimeout(30);}
              await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(1700);

              const state=await page.evaluate(({expected,quickLabels,width})=>{
                const bodyStyle=getComputedStyle(document.body),first=document.querySelector('a'),firstStyle=first?getComputedStyle(first):null,images=[...document.images],allText=document.body.textContent||'';
                const version=document.body?.dataset?.siteVersion||document.documentElement?.dataset?.siteVersion||document.querySelector('meta[name="x-magicoffice-preview"]')?.content||'';
                const fixedContainers=[...document.querySelectorAll('body *')].filter(element=>{const style=getComputedStyle(element),rect=element.getBoundingClientRect();return style.position==='fixed'&&style.display!=='none'&&style.visibility!=='hidden'&&rect.width>0&&rect.height>0;});
                const quickVisible=fixedContainers.some(element=>quickLabels.every(label=>(element.innerText||'').includes(label)));
                const fixedLineVisible=[...document.querySelectorAll('a[href*="lin.ee"]')].some(link=>{const style=getComputedStyle(link),rect=link.getBoundingClientRect();return style.position==='fixed'&&style.display!=='none'&&style.visibility!=='hidden'&&rect.width>0&&rect.height>0;});
                const requiredSections=['#worlds','#roster','#schedule','#event-hub','#menu','#first-visit','#location'];
                const scheduleText=document.querySelector('#schedule')?.textContent||'';
                const external=[...document.querySelectorAll('a[href]')].map(link=>link.href);
                return {version,remoteRevision:document.documentElement?.dataset?.remotePreview||'',background:bodyStyle.backgroundColor,font:bodyStyle.fontFamily,rawBlue:Boolean(firstStyle&&firstStyle.color==='rgb(0, 0, 238)'&&firstStyle.textDecorationLine.includes('underline')),viewport:innerWidth,scroll:document.documentElement.scrollWidth,images:images.length,broken:images.filter(image=>!image.complete||image.naturalWidth<=0).map(image=>image.alt||image.currentSrc||image.src),brandText:allText.includes('魔幻姶仕社'),sections:Object.fromEntries(requiredSections.map(selector=>[selector,Boolean(document.querySelector(selector))])),quickVisible,fixedLineVisible,scheduleInstagram:/Instagram|官方\s*IG|以\s*IG\s*為準/i.test(scheduleText),noindex:/noindex/i.test(document.querySelector('meta[name="robots"]')?.content||''),hasLine:external.some(url=>url.includes('lin.ee/NcCGG1P')),hasInstagram:external.some(url=>url.includes('instagram.com/maid_magicoffice')),hasReservation:external.some(url=>url.includes('gforms.app/r/71hSwQR')),width};
              },{expected,quickLabels,width});

              const menu={required:width<=1180,toggleFound:true,opened:true,closed:true,lineEntry:true};
              if(menu.required){const toggle=page.locator('.menu-toggle').first();menu.toggleFound=await toggle.count()>0;if(menu.toggleFound){await toggle.click();await page.waitForTimeout(300);menu.opened=await page.evaluate(()=>{const nav=document.querySelector('.main-nav'),toggle=document.querySelector('.menu-toggle');if(!nav||!toggle)return false;const style=getComputedStyle(nav),rect=nav.getBoundingClientRect();return toggle.getAttribute('aria-expanded')==='true'&&style.display!=='none'&&style.visibility!=='hidden'&&rect.width>0&&rect.height>0;});menu.lineEntry=await page.evaluate(()=>Boolean([...document.querySelectorAll('.main-nav a')].find(link=>(link.textContent||'').includes('LINE 官方'))));await page.screenshot({path:`rc4-${name}-menu.png`});await toggle.click();await page.waitForTimeout(200);menu.closed=await page.evaluate(()=>document.querySelector('.menu-toggle')?.getAttribute('aria-expanded')==='false');}else{menu.opened=menu.closed=menu.lineEntry=false;}}
              await page.screenshot({path:`rc4-${name}-top.png`});

              const checks={http200:response?.status()===200,version:state.version===expected,remoteRevision:state.remoteRevision==='rc3',styled:!['rgba(0, 0, 0, 0)','rgb(255, 255, 255)'].includes(state.background)&&!state.font.includes('Times New Roman'),notRaw:!state.rawBlue,responsive:state.scroll<=state.viewport+2,images:state.images>=40&&state.broken.length===0,brand:state.brandText,sections:Object.values(state.sections).every(Boolean),quickNav:width<=767?state.quickVisible:true,lineFloat:width<=767?!state.fixedLineVisible:(width>1180?state.fixedLineVisible:true),attendance:!state.scheduleInstagram,noindex:state.noindex,line:state.hasLine,instagram:state.hasInstagram,reservation:state.hasReservation,menu:!menu.required||(menu.toggleFound&&menu.opened&&menu.closed&&menu.lineEntry),noPageErrors:pageErrors.length===0,noAssetFailures:assetFailures.length===0};
              const failures=Object.entries(checks).filter(([,value])=>!value).map(([key])=>key);
              results.push({name,engine,viewport:{width,height},passed:failures.length===0,checks,failures,state,menu,pageErrors,assetFailures,status:response?.status()||0});
              await context.close();
            }
          }finally{await engines.chromium.close();await engines.webkit.close();}
          const report={version:expected,previewRevision:'rc3',qaGateRevision:'rc4-corrected-assertions',target,generatedAt:new Date().toISOString(),productionModified:false,attendanceSpreadsheetModified:false,testedCases:results.length,passedCases:results.filter(result=>result.passed).length,failedCases:results.filter(result=>!result.passed).length,releaseGate:{previewReviewAllowed:results.every(result=>result.passed),productionAllowed:false,productionBlocker:'Three Preview-only visual fallbacks remain.'},results};
          fs.mkdirSync('v207-analysis',{recursive:true});fs.writeFileSync('v207-analysis/live-preview-qa-rc4.json',JSON.stringify(report,null,2));console.log('MAGICOFFICE_V207_RC4_QA',JSON.stringify({testedCases:report.testedCases,passedCases:report.passedCases,failedCases:report.failedCases,previewReviewAllowed:report.releaseGate.previewReviewAllowed}));if(report.failedCases)process.exit(1);
          JS
          node qa-rc4.mjs
      - name: Commit corrected QA report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f v207-analysis/live-preview-qa-rc4.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v207-analysis/live-preview-qa-rc4.json
          if git diff --cached --quiet; then
            echo 'No corrected QA report changes.'
          else
            git commit -m 'Verify MagicOffice v2.0.7 live Preview RC3 with corrected gate'
            git pull --rebase origin v2.0.7-preview-source
            git push origin HEAD:v2.0.7-preview-source
          fi
      - name: Upload corrected QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_v2.0.7_Preview_RC3_corrected_QA
          path: |
            v207-analysis/live-preview-qa-rc4.json
            rc4-*.png
          if-no-files-found: warn
          retention-days: 14
