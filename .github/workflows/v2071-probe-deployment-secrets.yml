name: Probe MagicOffice v2.0.7.1 deployment credentials

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.7-preview-source
    paths:
      - '.github/workflows/v2071-probe-deployment-secrets.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_CLI_TOKEN: ${{ secrets.VERCEL_CLI_TOKEN }}
      MAGICOFFICE_VERCEL_TOKEN: ${{ secrets.MAGICOFFICE_VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.7-preview-source
          fetch-depth: 0
      - name: Record credential availability only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v207-analysis
          python - <<'PY'
          import json, os
          names = [
              'VERCEL_TOKEN',
              'VERCEL_ACCESS_TOKEN',
              'VERCEL_CLI_TOKEN',
              'MAGICOFFICE_VERCEL_TOKEN',
              'VERCEL_ORG_ID',
              'VERCEL_PROJECT_ID',
          ]
          report = {
              'valuesExposed': False,
              'availability': {name: bool(os.environ.get(name)) for name in names},
          }
          with open('v207-analysis/v2071-deployment-credential-availability.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, ensure_ascii=False, indent=2)
          print('Credential availability recorded without values.')
          PY
      - name: Commit availability report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v207-analysis/v2071-deployment-credential-availability.json
          if git diff --cached --quiet; then
            echo 'No credential availability changes.'
          else
            git commit -m 'Probe MagicOffice v2.0.7.1 deployment credential availability'
            git pull --rebase origin v2.0.7-preview-source
            git push origin HEAD:v2.0.7-preview-source
          fi
