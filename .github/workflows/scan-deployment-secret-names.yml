name: Audit deployment credential names

on:
  push:
    paths:
      - '.github/workflows/scan-deployment-secret-names.yml'

permissions:
  contents: read
  deployments: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List referenced secret names, environments, and deployment commands
        shell: bash
        run: |
          set -euo pipefail
          echo '--- SECRET REFERENCES ---'
          grep -RhoE 'secrets\.[A-Za-z0-9_]+' .github/workflows | sort -u || true
          echo '--- ENVIRONMENT REFERENCES IN WORKFLOWS ---'
          grep -RInE '^[[:space:]]*environment:' .github/workflows || true
          echo '--- CONFIGURED REPOSITORY ENVIRONMENTS ---'
          status="$(curl -sS -o /tmp/environments.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/environments")"
          echo "environment_api_status=${status}"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/environments.json')
          try:
              d=json.loads(p.read_text())
          except Exception as e:
              print('environment_api_parse_error',e)
              print(p.read_text()[:500] if p.exists() else 'missing')
          else:
              for env in d.get('environments',[]):
                  print(env.get('name',''))
              if 'message' in d:
                  print('api_message',d['message'])
          PY
          echo '--- VERCEL REFERENCES ---'
          grep -RInE 'vercel(@| deploy| --token|rollback|VERCEL_)' .github/workflows | sed -n '1,500p' || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
