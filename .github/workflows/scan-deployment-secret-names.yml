name: Audit deployment credential names

on:
  push:
    paths:
      - '.github/workflows/scan-deployment-secret-names.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List referenced secret names, environments, and deployment commands
        shell: bash
        run: |
          set -euo pipefail
          echo '--- SECRET REFERENCES ---'
          grep -RhoE 'secrets\.[A-Za-z0-9_]+' .github/workflows | sort -u || true
          echo '--- ENVIRONMENT REFERENCES ---'
          grep -RInE '^[[:space:]]*environment:' .github/workflows || true
          echo '--- VERCEL REFERENCES ---'
          grep -RInE 'vercel(@| deploy| --token|rollback|VERCEL_)' .github/workflows | sed -n '1,500p' || true
