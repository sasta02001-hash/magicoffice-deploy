name: MagicOffice nameplate-free final render v2

on:
  push:
    branches: [magicoffice-nameplate-clean-20260901]
    paths: ['.github/workflows/magicoffice-nameplate-free-render-v2.yml']

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magicoffice-nameplate-clean-20260901
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load and run the corrected renderer
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          src=Path('.github/workflows/magicoffice-nameplate-free-render.yml')
          data=yaml.safe_load(src.read_text())
          wanted={
            'Install media tools':'01_install.sh',
            'Download reference, locked replacements, and Runway originals':'02_download.sh',
            'Rebuild clean 1080p master from source frames':'03_render.sh',
            'Validate, hash, and split exact final file':'04_validate.sh',
          }
          found={}
          for step in data['jobs']['render']['steps']:
            name=step.get('name')
            if name in wanted and 'run' in step:
              text=step['run']
              if name=='Rebuild clean 1080p master from source frames':
                text=text.replace("f'bridge:{i-131}/5'", "f'bridge:{(i-131)/5.0}'")
              Path(wanted[name]).write_text(text)
              found[name]=True
          missing=set(wanted)-set(found)
          if missing: raise SystemExit(f'missing embedded steps: {missing}')
          PY
          for s in 01_install.sh 02_download.sh 03_render.sh 04_validate.sh; do
            echo "===== RUN $s ====="
            bash "$s"
          done

      - name: Upload merge tools and reports
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_NAMEPLATE_FREE_merge_tools
          path: output/MagicOffice_NAMEPLATE_FREE_merge_tools.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Upload part 000
        if: ${{ hashFiles('output/parts/MagicOffice_NAMEPLATE_FREE_FINAL.mp4.part000') != '' }}
        uses: actions/upload-artifact@v4
        with: {name: MagicOffice_NAMEPLATE_FREE_part000, path: output/parts/MagicOffice_NAMEPLATE_FREE_FINAL.mp4.part000, compression-level: 0, retention-days: 1}
      - name: Upload part 001
        if: ${{ hashFiles('output/parts/MagicOffice_NAMEPLATE_FREE_FINAL.mp4.part001') != '' }}
