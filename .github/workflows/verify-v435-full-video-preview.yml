name: Verify v4.3.5 full homepage video Preview
on:
  push:
    paths: ['.github/workflows/verify-v435-full-video-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome, WebKit, media libraries, and Chinese fonts
        run: |
          python -m pip install --quiet requests playwright==1.55.0
          python -m playwright install --with-deps chrome webkit
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Verify the actual public Vercel review deployment
        env:
          CHECK_URL: https://magicoffice-video-review.vercel.app/
        run: python qa/v435-video-check.py
      - name: Store actual browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_v435_FULL_VIDEO_PREVIEW_checks
          path: v435-video-evidence/
          if-no-files-found: error
          retention-days: 14
