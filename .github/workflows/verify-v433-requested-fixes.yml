name: Verify v4.3.3 requested fixes on the actual deployment
on:
  push:
    paths: ['.github/workflows/verify-v433-requested-fixes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install codec-enabled Chrome and WebKit
        run: |
          python -m pip install --quiet requests playwright==1.55.0
          python -m playwright install --with-deps chrome webkit
          sudo apt-get install -y -qq fonts-noto-cjk
          google-chrome --version
      - name: Check the actual official production domain
        env:
          CHECK_URL: https://magicoffice.vercel.app/?verify=433-responsive-feedback
        run: python qa/v433-browser-check.py
      - name: Store actual production screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_v433_PRODUCTION_browser_checks
          path: v433-browser-evidence/
          if-no-files-found: error
          retention-days: 14
