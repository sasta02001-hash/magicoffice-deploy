name: Build MagicOffice v2.0.7.1 self-contained broken-asset hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.7-preview-source
    paths:
      - '.github/workflows/v2071-build-self-contained-hotfix.yml'
      - 'v207-site/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.7-preview-source
          fetch-depth: 0

      - name: Build one-file website with every local asset embedded
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, mimetypes, re

          root = Path('.')
          site = root / 'v207-site'
          source = site / 'index.html'
          out_dir = root / 'v2071-self-contained'
          out_dir.mkdir(parents=True, exist_ok=True)
          html = source.read_text('utf-8')

          link_pattern = re.compile(r'<link\b[^>]*rel=["\'][^"\']*stylesheet[^"\']*["\'][^>]*href=["\']([^"\']+)["\'][^>]*>', re.I)
          for match in list(link_pattern.finditer(html)):
              href = match.group(1)
              if href.startswith(('http://','https://','//','data:')):
                  continue
              path = site / href.split('?',1)[0].lstrip('/')
              css = path.read_text('utf-8')
              html = html.replace(match.group(0), f'<style data-inlined-from="{href}">\n{css}\n</style>')

          script_pattern = re.compile(r'<script\b([^>]*)\bsrc=["\']([^"\']+)["\']([^>]*)>\s*</script>', re.I)
          for match in list(script_pattern.finditer(html)):
              src = match.group(2)
              if src.startswith(('http://','https://','//','data:')):
                  continue
              path = site / src.split('?',1)[0].lstrip('/')
              js = path.read_text('utf-8')
              html = html.replace(match.group(0), f'<script data-inlined-from="{src}">\n{js}\n</script>')

          asset_records = []
          replacements = []
          for path in sorted((site / 'assets').rglob('*')):
              if not path.is_file():
                  continue
              rel = path.relative_to(site).as_posix()
              raw = path.read_bytes()
              mime = mimetypes.guess_type(path.name)[0] or 'application/octet-stream'
              uri = f'data:{mime};base64,' + base64.b64encode(raw).decode('ascii')
              replacements.append((rel, uri))
              asset_records.append({
                  'path': rel,
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'mime': mime,
              })

          for rel, uri in sorted(replacements, key=lambda item: len(item[0]), reverse=True):
              html = html.replace('/' + rel, uri)
              html = html.replace(rel, uri)

          html = re.sub(r'<link\b[^>]*rel=["\']manifest["\'][^>]*>', '', html, flags=re.I)
          html = re.sub(r'data-site-version="[^"]*"', 'data-site-version="2.0.7.1-broken-asset-hotfix"', html)
          if 'data-site-version="2.0.7.1-broken-asset-hotfix"' not in html:
              html = html.replace('<body', '<body data-site-version="2.0.7.1-broken-asset-hotfix"', 1)
          html = re.sub(r'<meta[^>]+name=["\']robots["\'][^>]*>', '<meta name="robots" content="noindex,nofollow,noarchive,max-image-preview:large">', html, count=1, flags=re.I)
          marker = '<meta name="x-magicoffice-hotfix" content="2.0.7.1-broken-asset-hotfix">'
          if 'x-magicoffice-hotfix' not in html:
              html = html.replace('</head>', marker + '\n</head>', 1)

          survivors = sorted(set(re.findall(r'''(?:(?:src|href)=["']|url\(["']?)(/?assets/[^"')\s?#]+)''', html, re.I)))
          if survivors:
              raise RuntimeError('Local asset references remain: ' + json.dumps(survivors[:30], ensure_ascii=False))

          output = out_dir / 'index.html'
          output.write_text(html, 'utf-8')
          size = output.stat().st_size
          if size < 3_000_000 or size > 35_000_000:
              raise RuntimeError(f'Unexpected standalone size: {size}')
          for required in ('魔幻姶仕社','本週出勤','線上購拍','https://lin.ee/NcCGG1P','2.0.7.1-broken-asset-hotfix'):
              if required not in html:
                  raise RuntimeError(f'Required marker missing: {required}')

          report = {
              'version': '2.0.7.1-broken-asset-hotfix',
              'source': 'v207-site',
              'output': 'v2071-self-contained/index.html',
              'bytes': size,
              'sha256': hashlib.sha256(output.read_bytes()).hexdigest(),
              'embeddedAssetCount': len(asset_records),
              'survivingLocalReferences': survivors,
              'productionModified': False,
              'attendanceSpreadsheetModified': False,
              'assets': asset_records,
          }
          (out_dir / 'build-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), 'utf-8')
          print('MAGICOFFICE_V2071_SELF_CONTAINED', json.dumps({k: report[k] for k in ['version','bytes','sha256','embeddedAssetCount','productionModified','attendanceSpreadsheetModified']}))
          PY

      - name: Validate single-file asset independence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('v2071-self-contained/index.html')
          if not path.exists():
              raise SystemExit('Standalone file missing')
          html = path.read_text('utf-8')
          required = ['2.0.7.1-broken-asset-hotfix','魔幻姶仕社','本週出勤','https://lin.ee/NcCGG1P']
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit('Missing required markers: ' + repr(missing))
          survivors = re.findall(r'''(?:(?:src|href)=["']|url\(["']?)(/?assets/[^"')\s?#]+)''', html, re.I)
          if survivors:
              raise SystemExit('Local asset references remain: ' + repr(sorted(set(survivors))[:30]))
          print('SELF_CONTAINED_VALIDATION_OK', path.stat().st_size)
          PY

      - name: Commit self-contained hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2071-self-contained
          if git diff --cached --quiet; then
            echo 'No standalone hotfix changes.'
          else
            git commit -m 'Build MagicOffice v2.0.7.1 self-contained asset hotfix'
            git pull --rebase origin v2.0.7-preview-source
            git push origin HEAD:v2.0.7-preview-source
          fi
