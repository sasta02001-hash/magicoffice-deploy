name: Verify and repair Moon website
on:
  push:
    branches: [moon-maintenance]
    paths: ['moon-maintenance/*.mjs', 'moon-maintenance/baseline.json', '.github/workflows/moon-maintenance.yml']
permissions:
  contents: read
concurrency:
  group: moon-website-maintenance
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore current source and patch navigation
        env:
          VERCEL_TOKEN: ${{ secrets.MAGICOFFICE }}
        run: node moon-maintenance/repair.mjs prepare
      - name: Install verification browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify desktop and responsive layout before publication
        run: node moon-maintenance/verify.mjs local
      - name: Publish only after validation and production baseline check
        env:
          VERCEL_TOKEN: ${{ secrets.MAGICOFFICE }}
        run: node moon-maintenance/repair.mjs publish
      - name: Verify original production URLs
        run: node moon-maintenance/verify.mjs production
      - name: Save verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moon-maintenance-receipt
          path: evidence/
          retention-days: 30
