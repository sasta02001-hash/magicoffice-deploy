name: Identify clean scene v7 payload

on:
  push:
    paths:
      - '.github/workflows/identify-clean-scene-v7-payload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  identify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Try valid chunk combinations and identify WebP payloads
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import base64,hashlib,itertools,json,re,struct
          root=Path('source-assets/clean-scene-v7')
          files=sorted(root.glob('part-*.txt'))
          groups={}
          for p in files:
            m=re.match(r'part-(\d\d)([a-z]?)\.txt$',p.name)
            if not m: continue
            groups.setdefault(m.group(1),{})[m.group(2) or 'direct']=p
          options=[]
          for idx in sorted(groups):
            g=groups[idx]
            choices=[]
            if 'direct' in g:
              choices.append(('direct',[g['direct']]))
            subs=[g[k] for k in sorted(g) if k!='direct']
            if subs:
              choices.append(('subparts',subs))
            options.append((idx,choices))
          results=[]
          for selection in itertools.product(*[x[1] for x in options]):
            labels=[]; selected=[]
            for (idx,_),(label,paths) in zip(options,selection):
              labels.append(f'{idx}:{label}')
              selected.extend(paths)
            text=''.join(p.read_text().strip() for p in selected)
            try:
              raw=base64.b64decode(text,validate=True)
            except Exception:
              continue
            if not (len(raw)>24 and raw[:4]==b'RIFF' and raw[8:12]==b'WEBP'):
              continue
            results.append({
              'selection':labels,
              'files':[p.name for p in selected],
              'bytes':len(raw),
              'sha256':hashlib.sha256(raw).hexdigest(),
              'head':raw[:16].hex(),
            })
          out=Path('assets/home-hero-build-inspection')
          out.mkdir(exist_ok=True)
          (out/'clean-scene-v7-payload-candidates.json').write_text(json.dumps(results,indent=2))
          print(json.dumps({'groups':{k:list(v) for k,v in groups.items()},'validWebPCandidates':results},indent=2))
          PY
      - name: Commit candidate report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MagicOffice Build Bot'
          git config user.email 'sasta02001@gmail.com'
          git add assets/home-hero-build-inspection/clean-scene-v7-payload-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Identify clean scene v7 repository payload'
            git push origin HEAD:main
          fi
