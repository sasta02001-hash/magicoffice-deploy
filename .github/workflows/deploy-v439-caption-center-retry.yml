name: Deploy v4.3.9 centered video caption retry
on:
  push:
    paths: ['.github/workflows/deploy-v439-caption-center-retry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_44tkvxP20I5s9SUmlxfUEQM1
      VERCEL_PROJECT_ID: prj_JcF9cms6IGKkWJJsCaOWkwVVzA9D
      RELEASE: magicoffice-v4.3.9-video-caption-centered-2026-09-03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download current approved source and exact video
        run: |
          set -euo pipefail
          mkdir site
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 \
            'https://drive.usercontent.google.com/download?id=1V2mtf_qaPZWBa4wELmZ0xtgySSnps5_f&export=download&confirm=t' -o /tmp/site.tgz
          tar -tzf /tmp/site.tgz | grep -q 'src/index.template.html'
          tar -xzf /tmp/site.tgz -C site
          mkdir -p site/assets/video
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            'https://drive.usercontent.google.com/download?id=1LDyVVsaMrjK1U7eu5PBf1mVLrCgg0YrF&export=download&confirm=t' \
            -o site/assets/video/MagicOffice_FINAL_LARGE_SLOW_SUBTITLES_720p48_UNDER300MB.mp4
          test "$(stat -c%s site/assets/video/MagicOffice_FINAL_LARGE_SLOW_SUBTITLES_720p48_UNDER300MB.mp4)" -gt 240000000
      - name: Apply only the requested centering change
        run: |
          cat > site/assets/css/video-caption-center-v4.3.9.css <<'CSS'
          .mo-cinema-caption[data-video-display-name]{
            box-sizing:border-box;
            width:100%;
            max-width:none;
            margin:14px 0 0;
            padding:10px 12px 2px;
            display:grid;
            justify-items:center;
            align-items:center;
            text-align:center;
          }
          .mo-cinema-caption-label,
          .mo-cinema-caption-title{
            display:block;
            width:100%;
            margin-inline:auto;
            text-align:center;
          }
          @media(max-width:960px){
            .mo-cinema-caption[data-video-display-name]{margin-top:11px;padding-inline:8px}
          }
          CSS
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('site')
          p=root/'src/index.template.html'
          html=p.read_text(encoding='utf-8')
          old='magicoffice-v4.3.8-autoplay-poster-fallback-2026-09-03'
          new='magicoffice-v4.3.9-video-caption-centered-2026-09-03'
          if old not in html: raise SystemExit('Unexpected source release')
          if 'MagiCofficec魔幻世界人物誌' not in html: raise SystemExit('Drive display title changed')
          if 'data-video-start' in html: raise SystemExit('Blocking play button returned')
          html=html.replace(old,new)
          anchor='<link href="assets/css/video-autoplay-v4.3.8.css?v={{BUILD_VERSION}}" rel="stylesheet"/>'
          if html.count(anchor)!=1: raise SystemExit('Autoplay stylesheet anchor missing')
          html=html.replace(anchor,anchor+'\n<link href="assets/css/video-caption-center-v4.3.9.css?v={{BUILD_VERSION}}" rel="stylesheet"/>')
          p.write_text(html,encoding='utf-8')

          sp=root/'content/site.json'
          site=json.loads(sp.read_text(encoding='utf-8'))
          hero=site['hero']
          assert hero['driveDisplayName']=='MagiCofficec魔幻世界人物誌'
          assert hero['autoplay'] is True and hero['fallbackPoster'] is True
          hero['captionPlacement']='centered-directly-below-video'
          site['version']='production-v4.3.9-video-caption-centered'
          site['release']=new
          sp.write_text(json.dumps(site,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          vp=root/'vercel.json'
          v=json.loads(vp.read_text(encoding='utf-8'))
          v['buildCommand']='npm run build:offline'
          for rule in v.get('headers',[]):
            if rule.get('source')=='/(.*)':
              rule['headers']=[h for h in rule.get('headers',[]) if h.get('key','').lower()!='x-magicoffice-release']+[{'key':'X-MagicOffice-Release','value':new}]
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate and build
        working-directory: site
        run: |
          set -euo pipefail
          npm run check
          npm run test:data
          npm run build:offline
          grep -q "$RELEASE" dist/index.html
          grep -q 'video-caption-center-v4.3.9.css' dist/index.html
          grep -q '>MagiCofficec魔幻世界人物誌<' dist/index.html
          ! grep -q 'data-video-start' dist/index.html
          grep -q ' autoplay' dist/index.html
          grep -q ' poster=' dist/index.html
      - name: Deploy to the existing official project
        id: deploy
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_44tkvxP20I5s9SUmlxfUEQM1","projectId":"prj_JcF9cms6IGKkWJJsCaOWkwVVzA9D"}' > .vercel/project.json
          npx --yes vercel@59.3.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@59.3.0 build --prod --token="$VERCEL_TOKEN"
          URL="$(npx --yes vercel@59.3.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verify unchanged production URL
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            curl -fsS "https://magicoffice.vercel.app/?verify=v439-${i}" -o /tmp/index.html || true
            grep -q "$RELEASE" /tmp/index.html 2>/dev/null && break
            sleep 4
          done
          grep -q "$RELEASE" /tmp/index.html
          grep -q 'video-caption-center-v4.3.9.css' /tmp/index.html
          grep -q '>MagiCofficec魔幻世界人物誌<' /tmp/index.html
          curl -fsS 'https://magicoffice.vercel.app/assets/css/video-caption-center-v4.3.9.css' -o /tmp/caption.css
          grep -q 'text-align:center' /tmp/caption.css
          grep -q 'width:100%' /tmp/caption.css
          printf 'release=%s\ndeployment=%s\nverified_at=%s\n' "$RELEASE" '${{ steps.deploy.outputs.url }}' "$(date -u +%FT%TZ)" > v439-production-receipt.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MagicOffice_v439_caption_center_receipt
          path: v439-production-receipt.txt
          if-no-files-found: warn
          retention-days: 14
