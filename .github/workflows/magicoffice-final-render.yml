name: MagicOffice Final Render
on:
  push:
    paths: ['.github/workflows/magicoffice-final-render.yml']
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade gdown
      - run: |
          mkdir -p work/assets work/u work/np work/ng work/ns
          gdown --folder 'https://drive.google.com/drive/folders/1DGRecFN7xM_I0awecv5G5ms5OmpxLcHU' -O work/assets
          find work/assets -name '*.zip' -print0 | while IFS= read -r -d '' f; do d="work/u/$(basename "$f" .zip)"; mkdir -p "$d"; unzip -q -o "$f" -d "$d"; done
          unzip -q -o "$(find work/u -name MAGICOFFICE_NAMEPLATE_COMPONENTS_V2_DELIVERY.zip | head -1)" -d work/np
          unzip -q -o "$(find work/u -name MAGICOFFICE_COMMON_TEXT_GUIDES_AND_TIMING.zip | head -1)" -d work/ng
          unzip -q -o "$(find work/u -name SIX_NAMEPLATE_STATIC_MASTERS.zip | head -1)" -d work/ns
      - name: Print locked specs
        run: |
          echo '=== NAMEPLATE HANDOFF ==='
          cat "$(find work/u -name MAGICOFFICE_NAMEPLATE_HANDOFF_v1.txt | head -1)"
          echo '=== NAMEPLATE FILES ==='
          find work/np work/ng work/ns -type f -printf '%p\t%s\n' | sort
          echo '=== TIMING DOCS ==='
          find work/ng -type f \( -iname '*.txt' -o -iname '*.md' -o -iname '*.csv' -o -iname '*.json' \) -print0 | while IFS= read -r -d '' f; do echo "--- $f"; cat "$f"; done
          echo '=== AUDIO RECIPE ==='
          cat "$(find work/u -name AUDIO_MIX_RECIPE_LOCKED.txt | head -1)"
          echo '=== SUBTITLE MAP ==='
          cat "$(find work/u -name SUBTITLE_TIMING_MAP_LOCKED.csv | head -1)"
          echo '=== SOFT README ==='
          cat "$(find work/u -path '*MagicOffice_SOFT_ENTRANCES*' -name README.md | head -1)"
