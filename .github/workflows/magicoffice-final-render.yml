name: MagicOffice Final Render
on:
  push:
    paths: ['.github/workflows/magicoffice-final-render.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade gdown
      - name: Download and unpack locked source bundles
        run: |
          mkdir -p work/assets work/unpacked
          gdown --folder 'https://drive.google.com/drive/folders/1DGRecFN7xM_I0awecv5G5ms5OmpxLcHU' -O work/assets
          find work/assets -name '*.zip' -print0 | while IFS= read -r -d '' f; do d="work/unpacked/$(basename "$f" .zip)"; mkdir -p "$d"; unzip -q -o "$f" -d "$d"; done
          NP=$(find work/unpacked -name 'MAGICOFFICE_NAMEPLATE_COMPONENTS_V2_DELIVERY.zip' | head -1); [ -z "$NP" ] || { mkdir -p work/nameplates; unzip -q -o "$NP" -d work/nameplates; }
          CG=$(find work/unpacked -name 'MAGICOFFICE_COMMON_TEXT_GUIDES_AND_TIMING.zip' | head -1); [ -z "$CG" ] || { mkdir -p work/nameplate_guides; unzip -q -o "$CG" -d work/nameplate_guides; }
          SM=$(find work/unpacked -name 'SIX_NAMEPLATE_STATIC_MASTERS.zip' | head -1); [ -z "$SM" ] || { mkdir -p work/nameplate_static; unzip -q -o "$SM" -d work/nameplate_static; }
      - name: Collect exact locked instructions
        run: |
          mkdir -p spec
          find work -type f \( -iname '*.md' -o -iname '*.txt' -o -iname '*.json' -o -iname '*.csv' -o -iname '*.ass' \) -print0 | while IFS= read -r -d '' f; do cp --parents "$f" spec/; done
          find work/nameplates work/nameplate_guides work/nameplate_static -type f -printf '%p\t%s bytes\n' 2>/dev/null | sort > spec/NAMEPLATE_FILES.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: magicoffice-locked-specs
          path: spec
          retention-days: 7
