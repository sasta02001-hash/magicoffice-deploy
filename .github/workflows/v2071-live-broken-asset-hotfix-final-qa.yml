name: Final QA MagicOffice v2.0.7.1 broken-asset hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.7-preview-source
    paths:
      - '.github/workflows/v2071-live-broken-asset-hotfix-final-qa.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: https://magicoffice-v207-release-candidate.vercel.app/
      EXPECTED_VERSION: 2.0.7.1-broken-asset-hotfix
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.7-preview-source
          fetch-depth: 0
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Verify actual rendered images and responsive behavior
        shell: bash
        run: |
          cat > final-qa.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium, webkit } from 'playwright';
          const target=process.env.TARGET_URL, expected=process.env.EXPECTED_VERSION;
          const cases=[
            {name:'desktop-chromium',engine:'chromium',w:1366,h:900,mobile:false,touch:false},
            {name:'tablet-chromium',engine:'chromium',w:1024,h:768,mobile:false,touch:true},
            {name:'android-chromium',engine:'chromium',w:360,h:800,mobile:true,touch:true,ua:'Mozilla/5.0 (Linux; Android 15; Pixel 9) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 Mobile Safari/537.36'},
            {name:'iphone-webkit',engine:'webkit',w:390,h:844,mobile:true,touch:true,ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.7 Mobile/15E148 Safari/604.1'},
            {name:'iphone-large-webkit',engine:'webkit',w:430,h:932,mobile:true,touch:true,ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.7 Mobile/15E148 Safari/604.1'}
          ];
          const browsers={chromium:await chromium.launch({headless:true}),webkit:await webkit.launch({headless:true})};
          const results=[];
          try{
            for(const c of cases){
              const ctx=await browsers[c.engine].newContext({viewport:{width:c.w,height:c.h},screen:{width:c.w,height:c.h},isMobile:c.mobile,hasTouch:c.touch,userAgent:c.ua,locale:'zh-TW',timezoneId:'Asia/Taipei',serviceWorkers:'block'});
              const page=await ctx.newPage();const pageErrors=[],failReq=[];
              page.on('pageerror',e=>pageErrors.push(String(e?.stack||e)));
              page.on('requestfailed',r=>failReq.push({url:r.url(),error:r.failure()?.errorText||'unknown'}));
              const res=await page.goto(`${target}?assetfix=${Date.now()}-${c.name}`,{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForFunction(v=>(document.body?.dataset?.siteVersion||document.querySelector('meta[name="x-magicoffice-hotfix"]')?.content||'')===v,expected,{timeout:120000});
              await page.waitForTimeout(1200);
              await page.evaluate(()=>{for(const img of document.images){img.loading='eager';img.decoding='sync'}});
              const height=await page.evaluate(()=>Math.max(document.body.scrollHeight,document.documentElement.scrollHeight));
              for(let y=0;y<=height;y+=600){await page.evaluate(v=>scrollTo(0,v),y);await page.waitForTimeout(20)}
              await page.evaluate(()=>scrollTo(0,0));await page.waitForTimeout(1200);
              const state=await page.evaluate(({expected,w})=>{
                const visible=el=>{if(!el)return false;const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
                const imgs=[...document.images], sources=imgs.map(i=>i.currentSrc||i.src), body=getComputedStyle(document.body);
                const html=document.documentElement.innerHTML;
                const fixedLine=[...document.querySelectorAll('a[href*="lin.ee"]')].some(el=>getComputedStyle(el).position==='fixed'&&visible(el));
                return {
                  version:document.body?.dataset?.siteVersion||document.querySelector('meta[name="x-magicoffice-hotfix"]')?.content||'',
                  background:body.backgroundColor,font:body.fontFamily,viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                  imageCount:imgs.length,broken:imgs.filter(i=>!i.complete||i.naturalWidth<=0).map(i=>i.alt||i.src.slice(0,100)),
                  nonData:sources.filter(src=>!src.startsWith('data:image/')),
                  localAssetRefs:(html.match(/\/?assets\//g)||[]).length,
                  remoteAssetRefs:(html.match(/(?:raw\.githubusercontent\.com|cdn\.jsdelivr\.net)[^"']*assets\//g)||[]).length,
                  requiredSections:['#worlds','#roster','#schedule','#event-hub','#menu','#first-visit','#location'].every(id=>document.querySelector(id)),
                  mobileBar:visible(document.querySelector('.mobile-bar')),fixedLine,
                  scheduleIG:/Instagram|官方\s*IG|以\s*IG\s*為準/i.test(document.querySelector('#schedule')?.innerText||''),
                  noindex:/noindex/i.test(document.querySelector('meta[name=robots]')?.content||''),
                  line:[...document.querySelectorAll('a[href]')].some(a=>a.href.includes('lin.ee/NcCGG1P')),
                  reservation:[...document.querySelectorAll('a[href]')].some(a=>a.href.includes('gforms.app/r/71hSwQR')),
                  expected:(document.body?.dataset?.siteVersion||document.querySelector('meta[name="x-magicoffice-hotfix"]')?.content||'')===expected,w
                };
              },{expected,w:c.w});
              let menu={required:c.w<=1180,ok:true};
              if(menu.required){const t=page.locator('.menu-toggle').first();if(await t.count()){await t.click();await page.waitForTimeout(250);const opened=await t.getAttribute('aria-expanded')==='true';const line=await page.locator('.main-nav a',{hasText:'LINE 官方'}).count()>0;await t.click();await page.waitForTimeout(150);const closed=await t.getAttribute('aria-expanded')==='false';menu={required:true,opened,line,closed,ok:opened&&line&&closed}}else menu={required:true,ok:false};}
              await page.screenshot({path:`v2071-final-${c.name}.png`,fullPage:false});
              const checks={http200:res?.status()===200,version:state.expected,styled:!['rgba(0, 0, 0, 0)','rgb(255, 255, 255)'].includes(state.background),responsive:state.scrollWidth<=state.viewport+2,allImagesRendered:state.imageCount>=40&&state.broken.length===0,allImagesEmbedded:state.nonData.length===0,noLocalAssetDependencies:state.localAssetRefs===0,noRemoteAssetDependencies:state.remoteAssetRefs===0,sections:state.requiredSections,mobileBar:c.w<=760?state.mobileBar:!state.mobileBar,lineFloat:c.w<=760?!state.fixedLine:state.fixedLine,menu:menu.ok,attendance:!state.scheduleIG,noindex:state.noindex,links:state.line&&state.reservation,noPageErrors:pageErrors.length===0,noCriticalRequestFailures:failReq.filter(x=>!x.url.includes('docs.google.com')&&!x.url.includes('googleusercontent.com')).length===0};
              const failures=Object.entries(checks).filter(([,v])=>!v).map(([k])=>k);
              results.push({name:c.name,engine:c.engine,viewport:{width:c.w,height:c.h},passed:failures.length===0,checks,failures,state,menu,pageErrors,requestFailures:failReq,status:res?.status()||0});
              await ctx.close();
            }
          }finally{await browsers.chromium.close();await browsers.webkit.close()}
          const report={version:expected,target,generatedAt:new Date().toISOString(),testedCases:results.length,passedCases:results.filter(r=>r.passed).length,failedCases:results.filter(r=>!r.passed).length,productionModified:false,attendanceSpreadsheetModified:false,releaseGate:{brokenAssetHotfixPassed:results.every(r=>r.passed),manualRealDeviceReviewRequired:true,productionPromotionAuthorized:false},results};
          fs.mkdirSync('v207-analysis',{recursive:true});fs.writeFileSync('v207-analysis/v2071-live-broken-asset-hotfix-final-qa.json',JSON.stringify(report,null,2));
          console.log('MAGICOFFICE_V2071_FINAL_QA',JSON.stringify({testedCases:report.testedCases,passedCases:report.passedCases,failedCases:report.failedCases,brokenAssetHotfixPassed:report.releaseGate.brokenAssetHotfixPassed}));
          if(report.failedCases)process.exit(1);
          JS
          node final-qa.mjs
      - name: Commit final QA report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f v207-analysis/v2071-live-broken-asset-hotfix-final-qa.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v207-analysis/v2071-live-broken-asset-hotfix-final-qa.json
          if git diff --cached --quiet; then echo 'No final QA changes.'; else git commit -m 'Finalize MagicOffice v2.0.7.1 broken-asset hotfix QA'; git pull --rebase origin v2.0.7-preview-source; git push origin HEAD:v2.0.7-preview-source; fi
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_v2.0.7.1_final_broken_asset_QA
          path: |
            v207-analysis/v2071-live-broken-asset-hotfix-final-qa.json
            v2071-final-*.png
          if-no-files-found: warn
          retention-days: 14
