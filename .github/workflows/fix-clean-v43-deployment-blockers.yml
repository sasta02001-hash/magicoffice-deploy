name: Fix MagicOffice v4.3 replacement deployment blockers

on:
  push:
    paths:
      - '.github/workflows/fix-clean-v43-deployment-blockers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mobile hero crop and resilient audio playback
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-clean-v43-replacement-production.yml')
          text = workflow.read_text()
          old_mobile = "          get(old('/assets/media/magicoffice-home-clean-scene-v5.webp?v=20260901-clean-scene-v5'), 'assets/images/hero/background-mobile.webp', 50000)"
          new_mobile = """          with Image.open(site/'assets/images/hero/background-desktop.webp') as image:
              image = image.convert('RGB')
              width, height = image.size
              target_ratio = 1000 / 1333
              crop_width = min(width, max(1, round(height * target_ratio)))
              x0 = max(0, min(width - crop_width, round(width * 0.13)))
              mobile = image.crop((x0, 0, x0 + crop_width, height)).resize((1000, 1333), Image.Resampling.LANCZOS)
              mobile.save(site/'assets/images/hero/background-mobile.webp', 'WEBP', quality=91, method=6)
          print('GENERATED assets/images/hero/background-mobile.webp from approved desktop clean scene')"""
          if old_mobile not in text:
              raise SystemExit('mobile background source marker not found')
          workflow.write_text(text.replace(old_mobile, new_mobile, 1))

          app = Path('rebuild-v43/assets/app.js')
          text = app.read_text()
          old_catch = """      } catch {
        video.muted = true;
        sound?.setAttribute('aria-pressed', 'false');
        if (sound) sound.textContent = '開啟聲音';
      }"""
          new_catch = """      } catch {
        video.muted = true;
        sound?.setAttribute('aria-pressed', 'false');
        if (sound) sound.textContent = '開啟聲音';
        try { await video.play(); } catch {}
      }"""
          if old_catch not in text:
              raise SystemExit('video catch marker not found')
          app.write_text(text.replace(old_catch, new_catch, 1))

          test = Path('rebuild-v43/test.mjs')
          text = test.read_text()
          old_sound = """  const sound = await page.$('#video-sound');
  if (sound) await sound.click();
  await page.waitForFunction(() => { const v=document.querySelector('#hero-video'); return v && v.muted === false; }, { timeout:10000 });"""
          new_sound = """  const sound = await page.$('#video-sound');
  if (sound) {
    const muted = await page.$eval('#hero-video', (video) => video.muted);
    if (muted) await sound.click();
  }
  await page.waitForFunction(() => { const v=document.querySelector('#hero-video'); return v && v.muted === false; }, { timeout:10000 });"""
          if old_sound not in text:
              raise SystemExit('browser sound test marker not found')
          test.write_text(text.replace(old_sound, new_sound, 1))
          PY

          node --check rebuild-v43/assets/app.js
          node --check rebuild-v43/test.mjs

      - name: Commit corrected deployment source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MagicOffice Deployment Bot'
          git config user.email 'sasta02001@gmail.com'
          git add .github/workflows/deploy-clean-v43-replacement-production.yml rebuild-v43/assets/app.js rebuild-v43/test.mjs
          git commit -m 'Fix mobile background and resilient video verification for v4.3 replacement'
          git push origin HEAD:main
