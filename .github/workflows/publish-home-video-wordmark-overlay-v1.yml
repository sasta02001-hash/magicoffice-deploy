name: Publish MagicOffice decorated poster wordmark preview v1

on:
  push:
    paths:
      - '.github/workflows/publish-home-video-wordmark-overlay-v1.yml'

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add decorated MAGICOFFICE overlay to exact v3 poster
        shell: bash
        run: |
          set -euo pipefail
          python <<'PYCODE'
          from pathlib import Path
          import re

          page = Path('assets/home-hero-preview-v3/preview.html')
          html = page.read_text()
          release = 'home-video-wordmark-decor-2026-09-01-v1'

          # Idempotent cleanup: only this overlay is replaced.
          html = re.sub(r'<meta\s+name=["\']x-magicoffice-home-video-wordmark["\'][^>]*>', '', html, flags=re.I)
          html = re.sub(r'<style\s+id=["\']magicoffice-home-video-wordmark-v1["\']>[\s\S]*?</style>', '', html, flags=re.I)
          html = re.sub(r'<div\s+class=["\']home-video-wordmark["\'][^>]*>[\s\S]*?</div>', '', html, flags=re.I)

          style = '''<meta name="x-magicoffice-home-video-wordmark" content="home-video-wordmark-decor-2026-09-01-v1"/>
          <style id="magicoffice-home-video-wordmark-v1">
          .home-video-wordmark{position:absolute!important;left:2.65%!important;top:25%!important;width:43.75%!important;z-index:3!important;display:block!important;opacity:1!important;visibility:visible!important;pointer-events:none!important;user-select:none!important;transform:translateZ(0)!important;transition:opacity .28s ease,visibility .28s ease!important}
          .home-video-wordmark>svg{display:block!important;width:100%!important;height:auto!important;overflow:visible!important;filter:drop-shadow(0 6px 12px rgba(31,5,16,.22))!important}
          .homepage-cinema-stage[data-video-ready="true"] .home-video-wordmark,.homepage-cinema-stage[data-video-playable="true"] .home-video-wordmark{opacity:0!important;visibility:hidden!important}
          @media(max-width:960px){.home-video-wordmark{left:2.25%!important;top:24.5%!important;width:44.5%!important}}
          @media(max-width:430px){.home-video-wordmark{left:1.8%!important;top:24%!important;width:45.5%!important}}
          @media(prefers-reduced-motion:reduce){.home-video-wordmark{transition:none!important}}
          </style>'''

          if '</head>' not in html:
              raise SystemExit('Missing </head>')
          html = html.replace('</head>', style + '</head>', 1)

          svg = '<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250">\n<defs>\n <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4ea"/><stop offset=".42" stop-color="#f3d3c0"/><stop offset="1" stop-color="#c98d73"/></linearGradient>\n <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bf7f72" stop-opacity="0"/><stop offset=".18" stop-color="#f6d5c3" stop-opacity=".92"/><stop offset=".82" stop-color="#f6d5c3" stop-opacity=".92"/><stop offset="1" stop-color="#bf7f72" stop-opacity="0"/></linearGradient>\n <radialGradient id="veil"><stop stop-color="#260814" stop-opacity=".70"/><stop offset=".62" stop-color="#260814" stop-opacity=".30"/><stop offset="1" stop-color="#260814" stop-opacity="0"/></radialGradient>\n <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="b"/><feOffset dy="2.6"/><feColorMatrix values="0 0 0 0 0.06 0 0 0 0 0.01 0 0 0 0 0.03 0 0 0 .9 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>\n <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>\n</defs>\n<ellipse cx="280" cy="133" rx="278" ry="112" fill="url(#veil)" opacity=".48"/>\n<g fill="none" stroke="url(#line)" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" opacity=".96">\n <path d="M146 65 Q280 5 414 65"/>\n <path d="M62 76 H219 C241 76 251 64 260 57"/>\n <path d="M498 76 H341 C319 76 309 64 300 57"/>\n <path d="M62 76 l7 -4 l7 4 l-7 4 z M484 76 l7 -4 l7 4 l-7 4 z"/>\n <path d="M84 168 H178 C204 168 220 180 239 190 C255 199 269 188 280 177 C291 188 305 199 321 190 C340 180 356 168 382 168 H476"/>\n <path d="M178 168 C195 190 217 201 240 194 C225 212 197 211 181 187"/>\n <path d="M382 168 C365 190 343 201 320 194 C335 212 363 211 379 187"/>\n <path d="M258 202 C268 213 275 218 280 226 C285 218 292 213 302 202"/>\n <path d="M280 177 V226"/>\n <path d="M84 168 l7 -4 l7 4 l-7 4 z M462 168 l7 -4 l7 4 l-7 4 z"/>\n</g>\n<g fill="none" stroke="url(#gold)" stroke-width="1.35" filter="url(#glow)"><path d="M300 53 C292 43 294 33 300 27 C306 33 308 43 300 53 Z" transform="rotate(0 300 53)"/><path d="M300 53 C292 43 294 33 300 27 C306 33 308 43 300 53 Z" transform="rotate(72 300 53)"/><path d="M300 53 C292 43 294 33 300 27 C306 33 308 43 300 53 Z" transform="rotate(144 300 53)"/><path d="M300 53 C292 43 294 33 300 27 C306 33 308 43 300 53 Z" transform="rotate(216 300 53)"/><path d="M300 53 C292 43 294 33 300 27 C306 33 308 43 300 53 Z" transform="rotate(288 300 53)"/><circle cx="300" cy="53" r="3"/></g>\n<g fill="url(#gold)" stroke="#5d2034" stroke-opacity=".42" stroke-width="8" paint-order="stroke fill" filter="url(#shadow)"><path d="M848 31H755V658H848V689H657L447 169L263 689H66V658H122C140 658 150 650 152 635V117C152 82 143 56 124 40C117 34 95 31 58 31V0H278V31C239 31 217 34 210 41C193 58 185 83 185 117V617L406 10L421 11L663 620V31H570V0H848Z" transform="translate(38.860 150) scale(0.060000 -0.060000)"/><path d="M725 31H651L415 708H375L158 138C139 85 120 53 103 42C90 34 66 30 31 31V0H249V31C211 31 190 34 186 40C182 46 180 54 180 63C180 82 186 107 198 138L236 228H477L545 31H465V0H725ZM250 266 364 559 463 266Z" transform="translate(99.520 150) scale(0.060000 -0.060000)"/><path d="M647 271H415V239H528V120C528 102 527 88 523 80C520 69 501 56 466 44C428 29 392 21 357 22C300 23 255 53 221 112C187 172 170 249 170 345C170 555 235 665 365 673C481 679 530 624 539 510H569V667C531 682 506 690 495 692C462 700 417 704 360 704C275 704 204 672 145 607C86 539 56 453 55 345C54 246 83 161 142 90C204 21 275 -14 360 -14C419 -14 468 -8 509 2C544 13 578 25 613 35V239H647Z" transform="translate(150.400 150) scale(0.060000 -0.060000)"/><path d="M335 31H242V658H335V689H49V658H143V31H49V0H335Z" transform="translate(198.100 150) scale(0.060000 -0.060000)"/><path d="M585 128C546 89 511 62 478 47C438 28 390 19 334 20C277 21 232 52 198 111C165 171 148 249 148 344C148 559 213 669 342 675C462 680 508 627 517 512H547V669C513 682 489 690 474 693C440 700 395 704 339 704C253 704 181 672 123 607C63 540 33 452 32 344C31 245 61 160 121 89C181 19 254 -16 339 -16C398 -16 446 -7 484 10C526 29 564 63 599 112Z" transform="translate(226.900 150) scale(0.060000 -0.060000)"/><path d="M663 341C663 452 636 541 581 607C527 674 453 707 360 707C273 707 201 675 144 610C85 542 55 454 54 347C53 247 82 162 142 91C203 21 275 -14 360 -14C447 -14 519 20 576 89C634 158 663 242 663 341ZM552 343C552 247 537 171 506 114C473 52 425 21 363 21C231 21 165 130 165 347C165 451 178 530 205 583C237 645 289 676 360 676C427 676 477 643 510 578C538 522 552 444 552 343Z" transform="translate(269.380 150) scale(0.060000 -0.060000)"/><path d="M609 689H44V658H138V31H44V0H320V31H227V334H349C398 334 435 290 435 209H467V486H435C435 445 427 414 412 393C399 376 378 368 349 368H227V658L398 656C526 653 571 599 580 486H611Z" transform="translate(318.460 150) scale(0.060000 -0.060000)"/><path d="M609 689H44V658H138V31H44V0H320V31H227V334H349C398 334 435 290 435 209H467V486H435C435 445 427 414 412 393C399 376 378 368 349 368H227V658L398 656C526 653 571 599 580 486H611Z" transform="translate(363.220 150) scale(0.060000 -0.060000)"/><path d="M335 31H242V658H335V689H49V658H143V31H49V0H335Z" transform="translate(407.980 150) scale(0.060000 -0.060000)"/><path d="M585 128C546 89 511 62 478 47C438 28 390 19 334 20C277 21 232 52 198 111C165 171 148 249 148 344C148 559 213 669 342 675C462 680 508 627 517 512H547V669C513 682 489 690 474 693C440 700 395 704 339 704C253 704 181 672 123 607C63 540 33 452 32 344C31 245 61 160 121 89C181 19 254 -16 339 -16C398 -16 446 -7 484 10C526 29 564 63 599 112Z" transform="translate(436.780 150) scale(0.060000 -0.060000)"/><path d="M611 239C608 172 586 120 547 83C534 70 515 59 488 49C462 39 440 34 421 34L234 31V334H356C405 334 443 290 443 209H474V486H443C443 445 435 414 420 393C406 376 385 368 356 368H234V658L405 656C532 653 578 599 587 486H618L616 689H51V658H145V31H51V0H632L643 239Z" transform="translate(479.260 150) scale(0.060000 -0.060000)"/></g>\n<g fill="url(#gold)" filter="url(#glow)"><circle cx="280" cy="177" r="3"/><path d="M280 222 c-7-9-8-16 0-21 c8 5 7 12 0 21z"/></g>\n<g fill="#f6c7c1" opacity=".9"><circle cx="120" cy="101" r="2"/><circle cx="132" cy="95" r="1.4"/><circle cx="427" cy="96" r="1.8"/><circle cx="440" cy="104" r="1.35"/></g>\n</svg>'
          overlay = '<div class="home-video-wordmark" data-wordmark="MAGICOFFICE" aria-hidden="true">' + svg + '</div>'

          poster = re.compile(r'(<img\b[^>]*class=["\'][^"\']*\bhome-video-poster\b[^"\']*["\'][^>]*>)', re.I)
          match = poster.search(html)
          if not match:
              raise SystemExit('Exact v3 poster element not found')
          html = html[:match.end()] + overlay + html[match.end():]

          checks = {
              'release': release in html,
              'singleOverlay': html.count('class="home-video-wordmark"') == 1,
              'wordmark': 'data-wordmark="MAGICOFFICE"' in html,
              'originalPoster': 'magicoffice-home-video-poster-v1.webp' in html,
              'videoMount': 'data-home-video-mount' in html,
              'posterGuard': 'data-video-ready' in html,
              'desktopBackground': 'desktop-clean-scene-2026-09-01-v1' in html,
              'mobileNav': 'data-home-mobile-nav="four-core-links"' in html,
              'sections': all(x in html for x in ['id="roster"','id="schedule"','id="event-hub"','id="menu"','id="location"']),
          }
          failed = [k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('Preview checks failed: ' + ', '.join(failed))

          page.write_text(html)
          print('MAGICOFFICE_HOME_VIDEO_WORDMARK_V1_OK', checks)
          PYCODE

      - name: Commit preview-only change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MagicOffice Preview Bot'
          git config user.email 'sasta02001@gmail.com'
          git add assets/home-hero-preview-v3/preview.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add decorated MAGICOFFICE wordmark to v3 poster preview'
            git push origin HEAD:main
          fi
