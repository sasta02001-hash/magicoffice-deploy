name: Publish Qingwen all-day meal sets
on:
  push:
    branches: [qingwen-menu-combos-20260924]
    paths:
      - qingwen/**
      - .github/workflows/qingwen-menu.yml
permissions:
  contents: read
concurrency:
  group: qingwen-coffee-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install browser verification
        run: |
          npm install --prefix /tmp/qingwen-browser --no-save --ignore-scripts playwright@1.62.1
          /tmp/qingwen-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Preserve Wi-Fi and publish the approved menu sets
        env:
          VERCEL_TOKEN: ${{ secrets.MAGICOFFICE }}
          VERCEL_TELEMETRY_DISABLED: '1'
          NO_UPDATE_NOTIFIER: '1'
        run: node qingwen/publish.mjs
      - name: Save deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qingwen-menu-receipt
          path: |
            qingwen/receipt.json
            qingwen/verification/
          if-no-files-found: warn
          retention-days: 30
