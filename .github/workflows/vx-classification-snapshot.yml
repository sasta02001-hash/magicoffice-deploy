name: Snapshot VX Portfolio Source
on:
  push:
    branches: [vx-maintenance]
    paths: ['vx-classification-20261006/snapshot.mjs', '.github/workflows/vx-classification-snapshot.yml']
permissions:
  contents: read
concurrency:
  group: vx-website-maintenance
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read verified production source
        env:
          VERCEL_TOKEN: ${{ secrets.MAGICOFFICE }}
        run: node vx-classification-20261006/snapshot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vx-classification-source
          path: vx-classification-20261006/snapshot
          retention-days: 7
