name: Build safe incremental MagicOffice home video and wordmark v2

on:
  push:
    paths:
      - '.github/workflows/build-safe-home-video-wordmark-v2.yml'
      - 'scripts/build_safe_home_v2.py'
      - 'scripts/test_safe_home_v2.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magicoffice-safe-home-video-wordmark-v2
  cancel-in-progress: false

env:
  OFFICIAL_URL: https://magicoffice.vercel.app/
  RELEASE: home-video-wordmark-safe-2026-09-01-v2
  POSTER_URL: https://raw.githubusercontent.com/sasta02001-hash/magicoffice-deploy/main/assets/home-hero-preview-v3/magicoffice-home-video-poster-v1.webp
  DESKTOP_BG_URL: https://raw.githubusercontent.com/sasta02001-hash/magicoffice-deploy/main/assets/home-clean-scene-desktop-v1/magicoffice-home-clean-scene-desktop-v1.webp
  MOBILE_BG_URL: https://magicoffice-l0ovo899x-magicoffice.vercel.app/assets/media/magicoffice-home-clean-scene-v5.webp?v=20260901-clean-scene-v5
  VIDEO_URL: https://github.com/sasta02001-hash/magicoffice-deploy/releases/download/magicoffice-home-trial-v1/magicoffice-home-trial-720p-v1.mp4
  VIDEO_BYTES: '67334731'
  VIDEO_SHA256: b65929fe53cd056a00281562bcee3ca58268f4cfef476eb4c1bef3cd6ea6a958

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the exact currently restored Production page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mo-safe-v2 assets/home-hero-production-safe-v2
          curl --fail --location --silent --show-error --max-time 90 "${OFFICIAL_URL}?safe-source=${RELEASE}-$(date +%s)" -o /tmp/mo-safe-v2/current.html
          echo "SOURCE_BYTES=$(wc -c < /tmp/mo-safe-v2/current.html)"
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/mo-safe-v2/current.html')
          s=p.read_text(errors='replace')
          checks={
            'size':p.stat().st_size>20000,
            'html':'<html' in s.lower(),
            'brand':'MagicOffice' in s,
            'hero':'<section class="hero" id="top">' in s,
            'mobileBar':'手機版便捷選單' in s,
          }
          print('SOURCE_CHECKS',checks)
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('Invalid restored source: '+','.join(failed))
          PY
          if grep -q "$RELEASE" /tmp/mo-safe-v2/current.html; then
            echo 'Production already contains this candidate marker; refusing to use it as the source.' >&2
            exit 1
          fi

      - name: Apply only the approved hero changes
        run: python scripts/build_safe_home_v2.py

      - uses: browser-actions/setup-chrome@v1
        id: chrome

      - name: Browser-test desktop, mobile, poster fallback, and video playback
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
          python3 -m http.server 4173 --directory assets/home-hero-production-safe-v2 >/tmp/mo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test_safe_home_v2.mjs

      - name: Commit the verified candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MagicOffice Safe Production Bot'
          git config user.email 'sasta02001@gmail.com'
          git add assets/home-hero-production-safe-v2/
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified incremental home video and wordmark candidate v2'
            git push origin HEAD:main
          fi

      - name: Upload visual and machine-verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_safe_home_video_wordmark_v2_evidence
          path: |
            assets/home-hero-production-safe-v2/index.html
            assets/home-hero-production-safe-v2/index.html.gz.b64
            assets/home-hero-production-safe-v2/manifest.json
            assets/home-hero-production-safe-v2/browser-report.json
            assets/home-hero-production-safe-v2/desktop-1440x900.png
            assets/home-hero-production-safe-v2/mobile-390x844.png
            /tmp/mo-safe-v2/current.html
          if-no-files-found: warn
          retention-days: 14
