name: Test OIDC access to protected previous MagicOffice deployment

on:
  push:
    paths:
      - '.github/workflows/test-old-production-oidc-access.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Probe previous deployment root and key asset
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://magicoffice-l0ovo899x-magicoffice.vercel.app'
          root_status="$(curl -sS -L -o /tmp/root.html -w '%{http_code}' -H "x-vercel-trusted-oidc-idp-token: ${OIDC_TOKEN}" "${base}/?oidc-probe=$(date +%s)")"
          asset_status="$(curl -sS -L -o /tmp/logo.png -w '%{http_code}' -H "x-vercel-trusted-oidc-idp-token: ${OIDC_TOKEN}" "${base}/assets/media/da930bd7fba6ff56.png?v=2072")"
          echo "ROOT_STATUS=${root_status} ROOT_BYTES=$(wc -c </tmp/root.html)"
          echo "ASSET_STATUS=${asset_status} ASSET_BYTES=$(wc -c </tmp/logo.png)"
          file /tmp/root.html /tmp/logo.png || true
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/root.html').read_bytes()
          logo=Path('/tmp/logo.png').read_bytes()
          checks={
            'root200': root.startswith(b'<!DOCTYPE html') or root.startswith(b'<!doctype html'),
            'rootHero': b'homepage-hero-v2' in root,
            'logoPng': logo.startswith(b'\x89PNG\r\n\x1a\n'),
          }
          print('OIDC_ACCESS_CHECKS', checks)
          if not all(checks.values()): raise SystemExit('OIDC access did not return protected deployment bytes')
          PY
