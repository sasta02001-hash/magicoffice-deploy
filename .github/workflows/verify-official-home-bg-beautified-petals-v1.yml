name: Verify official beautified homepage background and petals

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-official-home-bg-beautified-petals-v1.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_URL: https://magicoffice.vercel.app/
      RELEASE_MARKER: home-bg-beautified-petals-2026-09-01-v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null

      - name: Verify and capture official desktop and mobile pages
        shell: bash
        run: |
          set -euo pipefail
          cat > verify-official.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const cases = [
            { name: 'desktop', viewport: { width: 1440, height: 900 }, mobile: false },
            { name: 'mobile', viewport: { width: 390, height: 844 }, mobile: true },
          ];
          const report = [];
          try {
            for (const item of cases) {
              const context = await browser.newContext({
                viewport: item.viewport,
                screen: item.viewport,
                isMobile: item.mobile,
                hasTouch: item.mobile,
                deviceScaleFactor: item.mobile ? 2 : 1,
                locale: 'zh-TW',
                timezoneId: 'Asia/Taipei',
                reducedMotion: 'no-preference',
              });
              const page = await context.newPage();
              const pageErrors = [];
              const sameOriginFailures = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              page.on('requestfailed', request => {
                if (request.url().startsWith(process.env.TEST_URL)) sameOriginFailures.push({ url: request.url(), error: request.failure()?.errorText || '' });
              });
              const url = `${process.env.TEST_URL}?official-bg-check=${Date.now()}-${item.name}`;
              const response = await page.goto(url, { waitUntil: 'load', timeout: 120000 });
              await page.waitForTimeout(1400);
              await page.locator('.mo-home-static-bg-image').evaluate(node => node.decode());
              const before = await page.locator('.mo-home-petal').evaluateAll(nodes => nodes.map(node => getComputedStyle(node).transform));
              await page.waitForTimeout(900);
              const after = await page.locator('.mo-home-petal').evaluateAll(nodes => nodes.map(node => getComputedStyle(node).transform));
              const state = await page.evaluate(() => {
                const hero = document.querySelector('.homepage-hero-v2');
                const layer = document.querySelector('.mo-home-static-bg');
                const image = document.querySelector('.mo-home-static-bg-image');
                const motion = document.querySelector('.mo-home-motion-bg');
                const rect = element => element?.getBoundingClientRect();
                const imageStyle = image ? getComputedStyle(image) : null;
                const layerStyle = layer ? getComputedStyle(layer) : null;
                const heroRect = rect(hero);
                const layerRect = rect(layer);
                return {
                  marker: document.querySelector('meta[name="x-magicoffice-home-static-background"]')?.content || '',
                  dynamicMarker: document.querySelector('meta[name="x-magicoffice-home-dynamic-background"]')?.content || '',
                  hero: Boolean(hero),
                  layer: Boolean(layer),
                  image: Boolean(image),
                  motion: Boolean(motion),
                  imageComplete: Boolean(image?.complete),
                  naturalWidth: image?.naturalWidth || 0,
                  naturalHeight: image?.naturalHeight || 0,
                  imageSrc: image?.currentSrc || image?.src || '',
                  imageDisplay: imageStyle?.display || '',
                  imageVisibility: imageStyle?.visibility || '',
                  imageOpacity: imageStyle?.opacity || '',
                  imageFilter: imageStyle?.filter || '',
                  objectPosition: imageStyle?.objectPosition || '',
                  layerDisplay: layerStyle?.display || '',
                  layerVisibility: layerStyle?.visibility || '',
                  layerOpacity: layerStyle?.opacity || '',
                  heroRect: heroRect ? { width: heroRect.width, height: heroRect.height } : null,
                  layerRect: layerRect ? { width: layerRect.width, height: layerRect.height } : null,
                  petals: document.querySelectorAll('.mo-home-petal').length,
                  animations: [...document.querySelectorAll('.mo-home-petal')].map(node => getComputedStyle(node).animationName),
                  booking: document.body.innerText.includes('立即訂位'),
                  attendance: document.body.innerText.includes('本週出勤'),
                  heartbeat: document.body.innerText.includes('心跳應援'),
                  video: Boolean(document.querySelector('.home-hero-stage')),
                  scrollWidth: document.documentElement.scrollWidth,
                  viewportWidth: innerWidth,
                };
              });
              const moved = before.filter((value, index) => value !== after[index]).length;
              const checks = {
                http200: response?.status() === 200,
                markers: state.marker === process.env.RELEASE_MARKER && state.dynamicMarker === process.env.RELEASE_MARKER,
                layers: state.hero && state.layer && state.image && state.motion,
                beautifiedImage: state.imageComplete && state.naturalWidth === 1000 && state.naturalHeight === 1333 && state.imageSrc.includes('magicoffice-home-bg-beautified-v1.webp'),
                visible: state.imageDisplay !== 'none' && state.imageVisibility === 'visible' && Number(state.imageOpacity) > 0 && state.layerDisplay !== 'none' && state.layerVisibility === 'visible' && Number(state.layerOpacity) > 0,
                coverage: state.layerRect && state.heroRect && state.layerRect.width >= state.heroRect.width - 1 && state.layerRect.height >= state.heroRect.height - 1,
                sixPetals: state.petals === 6,
                motion: moved >= 5 && state.animations.every(name => name.includes('mo-home-petal-fall')),
                preserved: state.booking && state.attendance && state.heartbeat && state.video,
                responsive: state.scrollWidth <= state.viewportWidth + 2,
                noPageErrors: pageErrors.length === 0,
                noSameOriginFailures: sameOriginFailures.length === 0,
              };
              const failures = Object.entries(checks).filter(([, ok]) => !ok).map(([name]) => name);
              await page.screenshot({ path: `official-${item.name}.png`, fullPage: false });
              report.push({ name: item.name, url, status: response?.status(), moved, state, checks, failures, pageErrors, sameOriginFailures });
              await context.close();
              if (failures.length) throw new Error(`${item.name}: ${failures.join(', ')}\n${JSON.stringify(report.at(-1), null, 2)}`);
            }
          } finally {
            await browser.close();
          }
          fs.writeFileSync('official-browser-report.json', JSON.stringify(report, null, 2));
          console.log('OFFICIAL_DESKTOP_MOBILE_OK', JSON.stringify(report.map(item => ({ name: item.name, moved: item.moved, image: item.state.imageSrc, filter: item.state.imageFilter }))));
          JS
          node verify-official.mjs

      - name: Upload official visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_official_home_bg_beautified_petals_v1
          path: |
            official-browser-report.json
            official-desktop.png
            official-mobile.png
          if-no-files-found: warn
          retention-days: 14
