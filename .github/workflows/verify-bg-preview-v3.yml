name: Verify restored homepage background preview v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-bg-preview-v3.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_URL: https://magicoffice-ny3ownlix-magicoffice.vercel.app/?_vercel_share=O4Y72aHS779MHKRyAt2uuRyAK4Uvg0k1
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture desktop and mobile rendered evidence
        run: |
          cat > verify.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const cases = [
            { name:'desktop', viewport:{width:1440,height:900}, mobile:false },
            { name:'mobile', viewport:{width:390,height:844}, mobile:true },
          ];
          const report=[];
          try {
            for (const item of cases) {
              const context=await browser.newContext({viewport:item.viewport,screen:item.viewport,isMobile:item.mobile,hasTouch:item.mobile,deviceScaleFactor:item.mobile?2:1,locale:'zh-TW',timezoneId:'Asia/Taipei',reducedMotion:'no-preference'});
              const page=await context.newPage();
              const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
              const response=await page.goto(process.env.TEST_URL,{waitUntil:'networkidle',timeout:120000});
              await page.waitForTimeout(1800);
              const state=await page.evaluate(()=>{
                const hero=document.querySelector('.homepage-hero-v2');
                const layer=document.querySelector('.mo-home-static-bg');
                const img=document.querySelector('.mo-home-static-bg-image');
                const shade=document.querySelector('.mo-home-static-bg-shade');
                const motion=document.querySelector('.mo-home-motion-bg');
                const r=e=>e?.getBoundingClientRect();
                const cs=e=>e?getComputedStyle(e):null;
                const heroRect=r(hero), layerRect=r(layer), imageStyle=cs(img), layerStyle=cs(layer), shadeStyle=cs(shade);
                return {
                  url:location.href,
                  marker:document.querySelector('meta[name="x-magicoffice-home-static-background"]')?.content||'',
                  hero:Boolean(hero), layer:Boolean(layer), image:Boolean(img), motion:Boolean(motion),
                  imageComplete:Boolean(img?.complete), naturalWidth:img?.naturalWidth||0, naturalHeight:img?.naturalHeight||0,
                  src:img?.currentSrc||img?.src||'',
                  layerDisplay:layerStyle?.display||'', layerVisibility:layerStyle?.visibility||'', layerOpacity:layerStyle?.opacity||'', layerZ:layerStyle?.zIndex||'',
                  imageDisplay:imageStyle?.display||'', imageVisibility:imageStyle?.visibility||'', imageOpacity:imageStyle?.opacity||'', objectFit:imageStyle?.objectFit||'', objectPosition:imageStyle?.objectPosition||'', filter:imageStyle?.filter||'',
                  shadeBackground:shadeStyle?.backgroundImage||'',
                  heroRect:heroRect?{x:heroRect.x,y:heroRect.y,width:heroRect.width,height:heroRect.height}:null,
                  layerRect:layerRect?{x:layerRect.x,y:layerRect.y,width:layerRect.width,height:layerRect.height}:null,
                  petals:document.querySelectorAll('.mo-home-petal').length,
                  booking:document.body.innerText.includes('立即訂位'), videoStage:Boolean(document.querySelector('.home-hero-stage')),
                  scrollWidth:document.documentElement.scrollWidth, viewportWidth:innerWidth,
                };
              });
              const checks={
                http200:response?.status()===200,
                marker:state.marker==='home-static-background-restored-2026-08-31-v3',
                elements:state.hero&&state.layer&&state.image&&state.motion,
                imageLoaded:state.imageComplete&&state.naturalWidth===1000&&state.naturalHeight===1333,
                visible:state.layerDisplay!=='none'&&state.layerVisibility==='visible'&&Number(state.layerOpacity)>0&&state.imageDisplay!=='none'&&state.imageVisibility==='visible'&&Number(state.imageOpacity)>0,
                covers:state.layerRect&&state.heroRect&&state.layerRect.width>=state.heroRect.width-1&&state.layerRect.height>=state.heroRect.height-1,
                petals:state.petals===4,
                content:state.booking&&state.videoStage,
                responsive:state.scrollWidth<=state.viewportWidth+2,
                noErrors:errors.length===0,
              };
              const failures=Object.entries(checks).filter(([,ok])=>!ok).map(([k])=>k);
              await page.screenshot({path:`${item.name}-bg-v3.png`,fullPage:false});
              report.push({name:item.name,status:response?.status(),state,checks,failures,errors});
              await context.close();
              if(failures.length)throw new Error(`${item.name}: ${failures.join(', ')}\n${JSON.stringify(report.at(-1),null,2)}`);
            }
          } finally { await browser.close(); }
          fs.writeFileSync('bg-preview-v3-report.json',JSON.stringify(report,null,2));
          console.log('BACKGROUND_PREVIEW_VISUAL_OK',JSON.stringify(report.map(x=>({name:x.name,state:x.state}))));
          JS
          node verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MagicOffice_background_preview_v3_evidence
          path: |
            desktop-bg-v3.png
            mobile-bg-v3.png
            bg-preview-v3-report.json
          if-no-files-found: warn
          retention-days: 7
