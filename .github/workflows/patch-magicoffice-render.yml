name: Patch MagicOffice renderer

on:
  push:
    branches: [magicoffice-nameplate-clean-20260901]
    paths: ['.github/workflows/patch-magicoffice-render.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: magicoffice-nameplate-clean-20260901
          fetch-depth: 1
      - name: Apply renderer correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/magicoffice-nameplate-free-render.yml')
          s=p.read_text()
          old="f'bridge:{i-131}/5'"
          new="f'bridge:{(i-131)/5.0}'"
          if old not in s:
              raise SystemExit('expected text not found')
          p.write_text(s.replace(old,new))
          PY
          git config user.name 'MagicOffice Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/magicoffice-nameplate-free-render.yml
          git commit -m 'Fix four-frame gate bridge alpha'
          git push origin HEAD:magicoffice-nameplate-clean-20260901
