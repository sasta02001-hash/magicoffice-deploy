name: Recover original MagicOffice homepage ukiyo-e background

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-original-home-ukiyoe-background.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all historical binary blobs for the exact original 1000x1333 WebP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import struct
          import subprocess
          from pathlib import Path

          EXPECTED_PREFIX = 'UklGRngMAgBXRUJQVlA4IGwMAgCwSwmdASroAzUF'
          EXPECTED_DIMS = (1000, 1333)

          def webp_size(data: bytes):
              if len(data) < 30 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  return None
              kind = data[12:16]
              if kind == b'VP8 ':
                  pos = data.find(b'\x9d\x01\x2a', 20, 80)
                  if pos < 0 or pos + 7 > len(data):
                      return None
                  return (
                      int.from_bytes(data[pos+3:pos+5], 'little') & 0x3fff,
                      int.from_bytes(data[pos+5:pos+7], 'little') & 0x3fff,
                  )
              if kind == b'VP8X' and len(data) >= 30:
                  return (
                      1 + int.from_bytes(data[24:27], 'little'),
                      1 + int.from_bytes(data[27:30], 'little'),
                  )
              if kind == b'VP8L' and len(data) >= 25 and data[20] == 0x2f:
                  bits = int.from_bytes(data[21:25], 'little')
                  return (bits & 0x3fff) + 1, ((bits >> 14) & 0x3fff) + 1
              return None

          rows = subprocess.check_output(['git', 'rev-list', '--objects', '--all'], text=True).splitlines()
          objects = []
          seen = set()
          for row in rows:
              parts = row.split(' ', 1)
              oid = parts[0]
              path = parts[1] if len(parts) == 2 else ''
              if oid in seen:
                  continue
              seen.add(oid)
              try:
                  if subprocess.check_output(['git', 'cat-file', '-t', oid], text=True).strip() != 'blob':
                      continue
                  size = int(subprocess.check_output(['git', 'cat-file', '-s', oid], text=True).strip())
              except Exception:
                  continue
              # Original RIFF length is roughly 134 KB. Keep a generous range.
              if size < 10_000 or size > 5_000_000:
                  continue
              priority = 0 if path.lower().endswith('.webp') or 'sakura-throne' in path.lower() else 1
              objects.append((priority, size, oid, path))

          objects.sort()
          scanned = 0
          webps = []
          candidates = []
          exact = None
          for _, size, oid, path in objects:
              head = subprocess.check_output(['git', 'cat-file', 'blob', oid])
              scanned += 1
              dims = webp_size(head)
              if not dims:
                  continue
              prefix = base64.b64encode(head).decode()[:len(EXPECTED_PREFIX)]
              item = {
                  'oid': oid,
                  'path': path,
                  'bytes': len(head),
                  'width': dims[0],
                  'height': dims[1],
                  'base64Prefix': prefix,
                  'sha256': hashlib.sha256(head).hexdigest(),
              }
              webps.append(item)
              if dims == EXPECTED_DIMS:
                  candidates.append(item)
              if dims == EXPECTED_DIMS and prefix == EXPECTED_PREFIX:
                  exact = (head, item)
                  break

          diagnostics = {
              'objectCandidatesScanned': scanned,
              'webpObjectsFound': len(webps),
              'matchingDimensions': candidates,
              'firstWebpObjects': webps[:100],
          }
          Path('recovery-binary-scan.json').write_text(
              json.dumps(diagnostics, ensure_ascii=False, indent=2), encoding='utf-8'
          )

          if exact is None:
              raise SystemExit(
                  'Exact original WebP was not found in Git history. '
                  f'Scanned {scanned} candidate blobs, found {len(webps)} WebPs and '
                  f'{len(candidates)} with dimensions 1000x1333.'
              )

          data, source = exact
          declared = struct.unpack('<I', data[4:8])[0] + 8
          if declared != len(data):
              raise SystemExit(f'RIFF length mismatch: declared={declared} actual={len(data)}')

          out_dir = Path('recovered-assets')
          out_dir.mkdir(parents=True, exist_ok=True)
          asset = out_dir / 'magicoffice-home-original-ukiyoe.webp'
          asset.write_bytes(data)
          report = {
              'source': source,
              'file': str(asset),
              'bytes': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
              'width': EXPECTED_DIMS[0],
              'height': EXPECTED_DIMS[1],
              'mime': 'image/webp',
              'exactHistoricalBase64PrefixMatched': True,
              'purpose': 'Exact original MagicOffice homepage ukiyo-e background behind the separate falling-petal layer',
          }
          (out_dir / 'magicoffice-home-original-ukiyoe.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (out_dir / 'README.md').write_text(
              '# MagicOffice original homepage background\n\n'
              'Recovered byte-for-byte from Git object history by matching both the original WebP base64 prefix and 1000 × 1333 dimensions.\n',
              encoding='utf-8',
          )
          print('ORIGINAL_HOME_BACKGROUND_RECOVERED', json.dumps(report, ensure_ascii=False))
          PY

      - name: Commit recovered binary asset and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MagicOffice Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add recovered-assets/magicoffice-home-original-ukiyoe.webp \
                  recovered-assets/magicoffice-home-original-ukiyoe.json \
                  recovered-assets/README.md
          if git diff --cached --quiet; then
            echo 'Recovered asset already matches the exact historical source.'
          else
            git commit -m 'Recover exact original MagicOffice homepage background'
            git push origin HEAD:main
          fi

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_original_home_ukiyoe_background_binary_scan
          path: |
            recovered-assets/magicoffice-home-original-ukiyoe.webp
            recovered-assets/magicoffice-home-original-ukiyoe.json
            recovered-assets/README.md
            recovery-binary-scan.json
          if-no-files-found: warn
          retention-days: 14
