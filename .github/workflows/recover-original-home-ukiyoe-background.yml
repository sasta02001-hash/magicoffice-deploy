name: Recover original MagicOffice homepage ukiyo-e background

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-original-home-ukiyoe-background.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the archived v2.0.7 source from Google Drive
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown '1IvJxaaGMiW3JyhMkKkOqPn44-Q1JAtaF' -O archived-v207-source.html
          test -s archived-v207-source.html
          SIZE="$(wc -c < archived-v207-source.html | tr -d ' ')"
          echo "ARCHIVED_SOURCE_BYTES=$SIZE"
          test "$SIZE" -gt 10000000

      - name: Extract and validate the exact original background WebP
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import re
          import struct
          from pathlib import Path

          source = Path('archived-v207-source.html')
          text = source.read_text(encoding='utf-8')
          expected_prefix = 'UklGRngMAgBXRUJQVlA4IGwMAgCwSwmdASroAzUF'
          marker = 'data:image/webp;base64,' + expected_prefix
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Exact historical background prefix not found in archived source.')

          payload_start = start + len('data:image/webp;base64,')
          match = re.match(r'[A-Za-z0-9+/=]+', text[payload_start:])
          if not match:
              raise SystemExit('Background base64 payload is incomplete.')
          data = base64.b64decode(match.group(0), validate=True)

          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Recovered payload is not WebP.')
          declared = struct.unpack('<I', data[4:8])[0] + 8
          if declared != len(data):
              raise SystemExit(f'RIFF length mismatch: declared={declared} actual={len(data)}')
          frame = data.find(b'\x9d\x01\x2a', 20, 80)
          if frame < 0:
              raise SystemExit('VP8 frame header missing.')
          width = int.from_bytes(data[frame+3:frame+5], 'little') & 0x3fff
          height = int.from_bytes(data[frame+5:frame+7], 'little') & 0x3fff
          if (width, height) != (1000, 1333):
              raise SystemExit(f'Unexpected dimensions: {width}x{height}')

          sha = hashlib.sha256(data).hexdigest()
          expected_sha = '44049d5f46ae6a12665e7a658e4d4a344fa8078dfd2fbb06da725ebd8e40cc65'
          if sha != expected_sha:
              raise SystemExit(f'Unexpected SHA256: {sha}')

          out = Path('recovered-assets')
          out.mkdir(parents=True, exist_ok=True)
          asset = out / 'magicoffice-home-original-background.webp'
          asset.write_bytes(data)
          report = {
              'sourceDriveFileId': '1IvJxaaGMiW3JyhMkKkOqPn44-Q1JAtaF',
              'sourceFile': source.name,
              'dataUriOffset': start,
              'file': str(asset),
              'bytes': len(data),
              'sha256': sha,
              'width': width,
              'height': height,
              'mime': 'image/webp',
              'base64Prefix': expected_prefix,
              'desktopBackgroundPosition': '68% 28%',
              'mobileBackgroundPosition': '58% center',
              'filter': 'saturate(.78) brightness(.62)',
              'purpose': 'Exact original MagicOffice homepage static background behind the separate four-petal animation layer'
          }
          (out / 'magicoffice-home-original-background.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          (out / 'README.md').write_text(
              '# MagicOffice original homepage background\n\n'
              'Recovered byte-for-byte from the archived v2.0.7 source.\n'
              'Validated as WebP 1000 × 1333, SHA-256 44049d5f46ae6a12665e7a658e4d4a344fa8078dfd2fbb06da725ebd8e40cc65.\n',
              encoding='utf-8'
          )
          print('ORIGINAL_HOME_BACKGROUND_RECOVERED', json.dumps(report, ensure_ascii=False))
          PY

      - name: Commit recovered binary asset and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MagicOffice Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add recovered-assets/magicoffice-home-original-background.webp \
                  recovered-assets/magicoffice-home-original-background.json \
                  recovered-assets/README.md
          if git diff --cached --quiet; then
            echo 'Exact background asset is already present.'
          else
            git commit -m 'Recover exact original MagicOffice homepage background'
            git push origin HEAD:main
          fi

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MagicOffice_original_home_background_recovery
          path: |
            recovered-assets/magicoffice-home-original-background.webp
            recovered-assets/magicoffice-home-original-background.json
            recovered-assets/README.md
          if-no-files-found: warn
          retention-days: 14
