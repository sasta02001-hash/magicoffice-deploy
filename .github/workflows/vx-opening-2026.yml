name: Publish VX Starfield Opening 2026
on:
  push:
    branches: [vx-maintenance]
    paths: ['vx-opening-2026/**', '.github/workflows/vx-opening-2026.yml']
permissions:
  contents: read
concurrency:
  group: vx-website-maintenance
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish verified opening campaign and homepage
        env:
          VERCEL_TOKEN: ${{ secrets.MAGICOFFICE }}
        run: node vx-opening-2026/publish.mjs
      - name: Save publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vx-opening-2026-receipt
          path: vx-opening-2026/publication-receipt.json
          if-no-files-found: error
          retention-days: 30
