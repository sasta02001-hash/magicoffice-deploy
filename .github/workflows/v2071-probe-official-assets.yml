name: Probe MagicOffice official high-quality asset availability

on:
  workflow_dispatch:
  push:
    branches:
      - v2.0.7-preview-source
    paths:
      - '.github/workflows/v2071-probe-official-assets.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.0.7-preview-source
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Probe exact hashed assets on official site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image
          import csv, io, json, mimetypes, time

          origin='https://magicoffice-preview-v2.vercel.app/assets/media/'
          targets=[]
          with Path('v207-input/v206-original-fingerprints.tsv').open(newline='',encoding='utf-8') as f:
              for row in csv.DictReader(f,delimiter='\t'):
                  row['width']=int(row['width']); row['height']=int(row['height']); targets.append(row)
          results=[]
          for row in targets:
              name=row['name']; url=origin+name
              result={'name':name,'url':url,'expectedWidth':row['width'],'expectedHeight':row['height'],'status':0,'bytes':0,'mime':'','decodable':False,'width':0,'height':0,'exactDimensions':False,'sufficientDimensions':False,'error':None}
              try:
                  req=Request(url,headers={'User-Agent':'MagicOffice-v2071-official-asset-probe','Accept':'image/*'})
                  with urlopen(req,timeout=40) as resp:
                      raw=resp.read(); result['status']=resp.status; result['bytes']=len(raw); result['mime']=resp.headers.get_content_type()
                  image=Image.open(io.BytesIO(raw)); image.load(); result['decodable']=True; result['width'],result['height']=image.size
                  result['exactDimensions']=(image.width==row['width'] and image.height==row['height'])
                  result['sufficientDimensions']=(image.width>=min(row['width'],760) and image.height>=min(row['height'],520))
              except Exception as exc:
                  result['error']=type(exc).__name__+': '+str(exc)
              results.append(result)
              time.sleep(.05)
          report={
              'origin':origin,
              'targetCount':len(results),
              'http200Count':sum(r['status']==200 for r in results),
              'decodableCount':sum(r['decodable'] for r in results),
              'exactDimensionCount':sum(r['exactDimensions'] for r in results),
              'sufficientDimensionCount':sum(r['sufficientDimensions'] for r in results),
              'missing':[r['name'] for r in results if r['status']!=200 or not r['decodable']],
              'undersized':[r['name'] for r in results if r['decodable'] and not r['sufficientDimensions']],
              'productionModified':False,
              'attendanceSpreadsheetModified':False,
              'results':results,
          }
          Path('v207-analysis').mkdir(exist_ok=True)
          Path('v207-analysis/v2071-official-asset-probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),'utf-8')
          print('MAGICOFFICE_OFFICIAL_ASSET_PROBE',json.dumps({k:report[k] for k in ['targetCount','http200Count','decodableCount','exactDimensionCount','sufficientDimensionCount','missing','undersized']},ensure_ascii=False))
          PY
      - name: Commit probe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v207-analysis/v2071-official-asset-probe.json
          if git diff --cached --quiet; then echo 'No asset probe changes.'; else git commit -m 'Probe MagicOffice official high-quality asset availability'; git pull --rebase origin v2.0.7-preview-source; git push origin HEAD:v2.0.7-preview-source; fi
